<style>
/* Layout: a radial argument graph on the left (claims at the centre, premises on the rim), a running account on the right, a timeline underneath. */
:root {
	--paper:#eef1f3; --panel:#f9fafb; --ink:#15202b; --muted:#56636f; --rule:#c4ccd4;
	--ok:#1f7a6d; --warn:#a86b12; --contest:#6455a3; --bad:#b0213a; --info:#4a6f8a;
	--serif:"Newsreader", Georgia, serif; --sans:"Public Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
	--paper:#0f151b; --panel:#151d25; --ink:#e4e9ee; --muted:#93a1ae; --rule:#2b3742;
	--ok:#4db6a4; --warn:#e0a84a; --contest:#a898e0; --bad:#ec6a7d; --info:#86a9c4; color-scheme:dark;
} }
:root[data-theme="dark"] {
	--paper:#0f151b; --panel:#151d25; --ink:#e4e9ee; --muted:#93a1ae; --rule:#2b3742;
	--ok:#4db6a4; --warn:#e0a84a; --contest:#a898e0; --bad:#ec6a7d; --info:#86a9c4; color-scheme:dark;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--paper); color:var(--ink); font:14px/1.5 var(--sans); display:flex; flex-direction:column;
	padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px; gap:10px; }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.top { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
h1 { font:600 22px/1.2 var(--serif); margin:0; text-wrap:balance; }
.sub { color:var(--muted); margin:0; }
.stage { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; }
.graph { min-width:0; min-height:0; position:relative; }
svg { width:100%; height:100%; display:block; }
aside { min-width:0; overflow:auto; border-left:1px solid var(--rule); padding-left:16px; display:flex; flex-direction:column; gap:12px; }
@media (max-width: 900px) { html, body { height:auto; } .stage { grid-template-columns:1fr; } .graph { height:min(92vw, 640px); } aside { border-left:0; border-top:1px solid var(--rule); padding:12px 0 0; } }

.act { font:600 12px/1 var(--sans); color:var(--muted); letter-spacing:.02em; }
.headline { font:500 21px/1.3 var(--serif); margin:0; min-height:2.6em; text-wrap:balance; }
.event { font-family:var(--serif); font-size:15px; min-height:7.5em; }
.event .meta { font:12px/1.5 var(--sans); color:var(--muted); display:block; margin-bottom:4px; }
.tally { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; font-variant-numeric:tabular-nums; }
.tally div { border:1px solid var(--rule); border-radius:6px; padding:6px 8px; }
.tally b { display:block; font:600 22px/1.1 var(--serif); color:var(--t); }
.tally span { font-size:12px; color:var(--muted); }
.legend { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:12px; color:var(--muted); align-items:center; }
.legend svg { width:18px; height:14px; }
.detail { border-top:1px solid var(--rule); padding-top:10px; font-size:13px; }
.detail p { margin:4px 0; }
.detail .prose { font-family:var(--serif); font-size:15px; }

.controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.controls button { border:1px solid var(--rule); background:var(--panel); border-radius:6px; padding:4px 12px; }
.controls button.primary { background:var(--ink); color:var(--panel); border-color:var(--ink); min-width:76px; }
.timeline { flex:1; min-width:200px; position:relative; height:30px; }
.timeline input { width:100%; margin:0; position:relative; z-index:1; accent-color:var(--ink); }
.marks { position:absolute; inset:18px 0 0; font-size:11px; color:var(--muted); }
.marks button { position:absolute; transform:translateX(-50%); border:0; background:none; padding:0; font-size:11px; color:var(--muted); white-space:nowrap; }
.marks button:hover { color:var(--ink); }
#clock { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; min-width:70px; }

.tip { position:absolute; pointer-events:none; max-width:300px; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:6px 8px; font-size:12px; box-shadow:0 4px 14px rgb(0 0 0 / .15); }
.tip b { display:block; font-weight:600; }
.lbl { font:500 12px var(--sans); fill:var(--ink); paint-order:stroke; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round; pointer-events:none; }
.lbl.big { font:600 14px var(--serif); }
.node { cursor:pointer; }
@media (prefers-reduced-motion: reduce) { .controls .primary { outline:2px dashed var(--warn); } }
</style>

<script>
const D = {"claims":[{"id":"relief-psj","text":"Partial summary judgment for Ohio Security and American Fire against Hartford and Ace declaring that (1) Hartford owed Carson Madrona a duty to defend the Underlying Lawsuit through the appeal or settlement and breached it, and Ohio Security may recover from Hartford $352,686.77 in appellate fees, $238,582.00 in costs and the post-judgment interest it paid; (2) Carson Madrona is an additional insured under the Ace Policy; and (3) coverage priority for Carson Madrona is Hartford, then Ohio Security, then Ace, then American Fire.","level":"relief","parent":null,"label":"Partial summary judgment"},{"id":"el-hartford-duty-to-defend","text":"Hartford owed Carson Madrona a continuing duty to defend the Underlying Lawsuit after the verdict, through the appeal or settlement, and breached it by withdrawing on September 11, 2023.","level":"element","parent":"relief-psj","label":"Hartford owed a defence"},{"id":"sub-ai-status-hartford","text":"Carson Madrona is an additional insured under the Hartford Policy's Lessors of Land provision because the Perez liability arose out of Ashley Furniture's use of the premises it leased.","level":"sub_issue","parent":"el-hartford-duty-to-defend","label":"Carson is an additional insured"},{"id":"sub-no-fault-requirement","text":"Additional-insured coverage under the Hartford Policy does not require Ashley Furniture's liability or fault, so the jury's failure to award damages against Ashley does not negate coverage for Carson Madrona.","level":"sub_issue","parent":"el-hartford-duty-to-defend","label":"No fault needed"},{"id":"sub-breach-withdrawal","text":"Hartford's post-verdict withdrawal, while the action was not concluded (appeal pending) and its limits were unexhausted, breached its defense duty.","level":"sub_issue","parent":"el-hartford-duty-to-defend","label":"Withdrawal was a breach"},{"id":"el-recovery-defense-amounts","text":"Ohio Security is entitled to recover from Hartford the defense-related amounts it paid on Carson Madrona's behalf after Hartford withdrew: appellate defense fees, taxed costs and post-judgment interest.","level":"element","parent":"relief-psj","label":"Ohio Security recovers its outlay"},{"id":"sub-defense-fees","text":"Ohio Security may recover the $352,686.77 in defense (appellate) fees it paid from Hartford's September 11, 2023 withdrawal to the September 30, 2024 settlement.","level":"sub_issue","parent":"el-recovery-defense-amounts","label":"Appellate fees"},{"id":"sub-costs","text":"Ohio Security may recover the $238,582.00 in costs taxed against Carson Madrona, because Hartford's supplementary payments obligation for taxed costs is part of its defense duty.","level":"sub_issue","parent":"el-recovery-defense-amounts","label":"Costs"},{"id":"sub-post-judgment-interest","text":"Ohio Security and American Fire may recover the $1,100,000 in post-judgment interest paid for the period from entry of judgment (August 7, 2023) to their August 13, 2024 limits offer, under Hartford's supplementary payments provision.","level":"sub_issue","parent":"el-recovery-defense-amounts","label":"Post-judgment interest"},{"id":"el-ace-additional-insured","text":"Carson Madrona qualifies as an insured (additional insured) under the Ace umbrella policy because it is insured under the Hartford Policy, the Ace Policy's scheduled underlying insurance.","level":"element","parent":"relief-psj","label":"Carson is insured under Ace"},{"id":"el-priority-of-coverage","text":"The priority of coverage for Carson Madrona's liability in the Underlying Lawsuit is: (1) Hartford Policy, (2) Ohio Security Policy, (3) Ace Policy, (4) American Fire Policy.","level":"element","parent":"relief-psj","label":"Order of coverage"},{"id":"sub-hartford-primary","text":"The Hartford Policy provides primary coverage to Carson Madrona ahead of all other policies, under the Lease's indemnity and primary/non-contributing insurance provisions and Rossmoor.","level":"sub_issue","parent":"el-priority-of-coverage","label":"Hartford pays first"},{"id":"sub-ohio-second","text":"The Ohio Security primary policy provides the second layer, attaching before the Ace and American Fire excess policies under horizontal exhaustion.","level":"sub_issue","parent":"el-priority-of-coverage","label":"Ohio Security second"},{"id":"sub-ace-before-american-fire","text":"The Ace excess policy issued to indemnitor Ashley provides the third layer, ahead of the American Fire excess policy issued to indemnitee Carson Madrona.","level":"sub_issue","parent":"el-priority-of-coverage","label":"Ace before American Fire"}],"inferences":[{"id":"el-hartford-duty-to-defend/i1-ai-written-contract","scheme":"rule_application","from":["el-hartford-duty-to-defend/p-text-ai-written-contract","el-hartford-duty-to-defend/p-text-lessors-of-land","el-hartford-duty-to-defend/p-fact-lease","el-hartford-duty-to-defend/p-fact-assignment","el-hartford-duty-to-defend/imp-lessee-is-named-insured","el-hartford-duty-to-defend/imp-lease-written-contract","el-hartford-duty-to-defend/p-text-lease-insurance","el-hartford-duty-to-defend/imp-occurrence-in-period","el-hartford-duty-to-defend/p-fact-hartford-policy"],"to":"sub-ai-status-hartford","text":"Carson Madrona is a person from whom the named insured leased premises under a pre-injury written contract requiring it to be insured, so it fits the Lessors of Land additional-insured category."},{"id":"el-hartford-duty-to-defend/i1-ai-arising-out-of","scheme":"precedent_analogy","from":["el-hartford-duty-to-defend/p-rule-arising-out-of","el-hartford-duty-to-defend/p-holding-truck-use","el-hartford-duty-to-defend/p-holding-hartford-casualty","el-hartford-duty-to-defend/p-holding-syufy","el-hartford-duty-to-defend/p-fact-ashley-employee-called","el-hartford-duty-to-defend/p-fact-use-reason-present","el-hartford-duty-to-defend/p-fact-mdp-supplied-ashley","el-hartford-duty-to-defend/p-fact-mdp-central","el-hartford-duty-to-defend/p-fact-incident","el-hartford-duty-to-defend/p-fact-arc-flash","el-hartford-duty-to-defend/imp-mdp-within-use"],"to":"sub-ai-status-hartford","text":"As in Truck, Hartford Casualty and Syufy, the tenant's use of its premises was the reason the injured person was present, which supplies the minimal causal connection the broad 'arising out of' language requires."},{"id":"el-hartford-duty-to-defend/i1-ai-lease-consistent","scheme":"interpretation","from":["el-hartford-duty-to-defend/p-text-lease-indemnity","el-hartford-duty-to-defend/p-text-lease-electrical","el-hartford-duty-to-defend/p-text-lessors-of-land"],"to":"sub-ai-status-hartford","text":"The Lessors of Land coverage is read consistently with the Lease, under which Ashley agreed to indemnify Carson for claims connected with its use of the premises and to maintain the electrical systems."},{"id":"el-hartford-duty-to-defend/i1-ai-hartford-admission","scheme":"documentary","from":["el-hartford-duty-to-defend/p-fact-tender","el-hartford-duty-to-defend/p-fact-ror-2020","el-hartford-duty-to-defend/p-fact-ror-2022","el-hartford-duty-to-defend/p-fact-hartford-defended"],"to":"sub-ai-status-hartford","text":"Hartford's own letters accepting the tender and defending Carson as a Lessors of Land additional insured show it cannot seriously dispute that status."},{"id":"el-hartford-duty-to-defend/i1-nofault-rule","scheme":"precedent_holding","from":["el-hartford-duty-to-defend/p-holding-vitton","el-hartford-duty-to-defend/p-holding-truck-fault","el-hartford-duty-to-defend/p-holding-american-casualty","el-hartford-duty-to-defend/p-holding-syufy"],"to":"sub-no-fault-requirement","text":"California courts hold that 'arising out of' additional-insured coverage that does not allocate coverage by fault does not depend on the named insured's negligence or liability."},{"id":"el-hartford-duty-to-defend/i1-nofault-analogy","scheme":"precedent_analogy","from":["el-hartford-duty-to-defend/p-holding-truck-use","el-hartford-duty-to-defend/p-fact-verdict-ashley","el-hartford-duty-to-defend/p-fact-verdict-carson","el-hartford-duty-to-defend/p-text-lessors-of-land","el-hartford-duty-to-defend/imp-not-fault-based-endorsement"],"to":"sub-no-fault-requirement","text":"Just as the tenant's summary judgment in Truck did not defeat the landlord's coverage, the jury's refusal to award damages against Ashley (which it still found negligent) does not negate Carson's coverage under fault-neutral Lessors of Land language."},{"id":"el-hartford-duty-to-defend/i1-breach","scheme":"rule_application","from":["el-hartford-duty-to-defend/p-rule-duration","el-hartford-duty-to-defend/p-rule-defend-all","el-hartford-duty-to-defend/p-fact-judgment","el-hartford-duty-to-defend/p-fact-withdrawal","el-hartford-duty-to-defend/p-fact-withdrawal-reason","el-hartford-duty-to-defend/p-fact-appeal","el-hartford-duty-to-defend/p-fact-settlement","el-hartford-duty-to-defend/imp-not-exhausted","el-hartford-duty-to-defend/imp-appeal-is-defense","el-hartford-duty-to-defend/imp-potential-persisted"],"to":"sub-breach-withdrawal","text":"Because the defense duty lasts until the action concludes or limits are exhausted, and Hartford withdrew while the appeal was pending and its limits were unexhausted, the withdrawal breached the duty."},{"id":"el-hartford-duty-to-defend/i1-element","scheme":"rule_application","from":["sub-ai-status-hartford","sub-no-fault-requirement","sub-breach-withdrawal","el-hartford-duty-to-defend/p-rule-broad-duty","el-hartford-duty-to-defend/p-rule-potential-test","el-hartford-duty-to-defend/p-rule-insured-burden","el-hartford-duty-to-defend/p-text-insuring-agreement","el-hartford-duty-to-defend/p-fact-allegations","el-hartford-duty-to-defend/p-fact-shared-control","el-hartford-duty-to-defend/imp-lease-in-force"],"to":"el-hartford-duty-to-defend","text":"An additional insured facing a suit potentially within coverage is owed a defense under the insuring agreement until the action concludes, so Hartford owed a continuing post-verdict defense and breached it by withdrawing."},{"id":"el-recovery-defense-amounts/i2-fees","scheme":"rule_application","from":["el-hartford-duty-to-defend","el-recovery-defense-amounts/p-fact-withdrawal","el-recovery-defense-amounts/p-fact-os-funded-appeal","el-recovery-defense-amounts/p-fact-os-defended","el-recovery-defense-amounts/imp-fees-reasonable","el-recovery-defense-amounts/imp-reimbursement-right"],"to":"sub-defense-fees","text":"Because Hartford breached a continuing duty to defend, the defense fees Ohio Security had to pay in its place are recoverable from Hartford."},{"id":"el-recovery-defense-amounts/i2-costs-law","scheme":"precedent_holding","from":["el-recovery-defense-amounts/p-holding-prichard","el-recovery-defense-amounts/p-holding-mintarsih","el-recovery-defense-amounts/p-rule-supp-defense"],"to":"sub-costs","text":"Prichard holds that supplementary-payment obligations are a function of the defense duty, so they follow wherever the defense duty exists."},{"id":"el-recovery-defense-amounts/i2-costs-apply","scheme":"rule_application","from":["el-recovery-defense-amounts/p-text-supp-intro","el-recovery-defense-amounts/p-text-supp-costs","el-hartford-duty-to-defend","el-recovery-defense-amounts/p-fact-costs-memo","el-recovery-defense-amounts/p-fact-costs-order","el-recovery-defense-amounts/p-fact-os-paid-costs","el-recovery-defense-amounts/imp-supp-despite-withdrawal","el-recovery-defense-amounts/imp-reimbursement-right"],"to":"sub-costs","text":"Hartford still owed a defense when it withdrew, its policy makes taxed costs part of that defense obligation, and Ohio Security paid the $238,582 in taxed costs, so it may recover them from Hartford."},{"id":"el-recovery-defense-amounts/i2-pji","scheme":"rule_application","from":["el-recovery-defense-amounts/p-text-supp-pji","el-recovery-defense-amounts/p-rule-pji-rate","el-recovery-defense-amounts/p-fact-judgment-date","el-recovery-defense-amounts/p-fact-offer-limits","el-recovery-defense-amounts/p-fact-pji-paid","el-recovery-defense-amounts/imp-hartford-no-offer","el-recovery-defense-amounts/imp-supp-despite-withdrawal","el-recovery-defense-amounts/imp-pji-amount-matches","el-hartford-duty-to-defend"],"to":"sub-post-judgment-interest","text":"Hartford's clause covers post-judgment interest on the full judgment until a limits offer; interest at 10% ran from August 7, 2023 to the August 13, 2024 offer and $1,100,000 was paid, so Hartford must reimburse it."},{"id":"el-recovery-defense-amounts/i2-element","scheme":"rule_application","from":["sub-defense-fees","sub-costs","sub-post-judgment-interest","el-recovery-defense-amounts/imp-reimbursement-right"],"to":"el-recovery-defense-amounts","text":"Each category of payment falls within Hartford's breached defense obligation, so Ohio Security is entitled to recover all three amounts from Hartford."},{"id":"el-ace-additional-insured/i3-read-clause","scheme":"interpretation","from":["el-ace-additional-insured/p-text-ace-who-insured","el-ace-additional-insured/p-text-ace-schedule","el-ace-additional-insured/p-fact-ace-policy"],"to":"el-ace-additional-insured","text":"The Ace insured definition extends to any person insured under the scheduled underlying insurance, which is the Hartford Policy."},{"id":"el-ace-additional-insured/i3-reliance","scheme":"precedent_holding","from":["el-ace-additional-insured/p-holding-reliance","el-ace-additional-insured/imp-ace-follow-form","el-ace-additional-insured/imp-ace-no-contrary"],"to":"el-ace-additional-insured","text":"Under Reliance National an additional insured on the primary policy is an additional insured on a follow-form excess policy that contains no contrary provision."},{"id":"el-ace-additional-insured/i3-apply","scheme":"rule_application","from":["sub-ai-status-hartford","el-ace-additional-insured/p-fact-certificate","el-ace-additional-insured/p-text-ace-who-insured","el-ace-additional-insured/imp-no-broader","el-ace-additional-insured/imp-ace-occurrence-in-period"],"to":"el-ace-additional-insured","text":"Because it is (said to be) undisputed that Carson is an additional insured under Hartford, Carson is an insured under the Ace Policy."},{"id":"el-priority-of-coverage/i4-h-rossmoor","scheme":"precedent_holding","from":["el-priority-of-coverage/p-holding-rossmoor"],"to":"sub-hartford-primary","text":"Rossmoor holds that an indemnitor's policy covering the indemnitee as additional insured is primary to the indemnitee's own insurance."},{"id":"el-priority-of-coverage/i4-h-analogy","scheme":"precedent_analogy","from":["el-priority-of-coverage/p-holding-rossmoor","el-priority-of-coverage/p-text-lease-indemnity","el-priority-of-coverage/p-text-lease-insurance","sub-ai-status-hartford","el-priority-of-coverage/imp-indemnity-covers-claim","el-priority-of-coverage/imp-lease-in-force"],"to":"sub-hartford-primary","text":"As in Rossmoor, Ashley agreed to indemnify Carson and procured Hartford coverage naming it, so Hartford, not Carson's own insurer, must bear the loss first."},{"id":"el-priority-of-coverage/i4-h-lease-primary","scheme":"interpretation","from":["el-priority-of-coverage/p-text-lease-primary","el-priority-of-coverage/imp-hartford-own-other-insurance"],"to":"sub-hartford-primary","text":"The Lease requires Ashley's insurance to be primary and non-contributing so Carson may look solely to it."},{"id":"el-priority-of-coverage/i4-h-consistent","scheme":"documentary","from":["el-priority-of-coverage/p-fact-certificate","el-priority-of-coverage/p-text-os-excess","el-priority-of-coverage/p-fact-hartford-limits"],"to":"sub-hartford-primary","text":"Hartford's certificate and Ohio Security's own excess-over-additional-insured clause are consistent with Hartford being first."},{"id":"el-priority-of-coverage/i4-o-horizontal","scheme":"rule_application","from":["el-priority-of-coverage/p-rule-horizontal-padilla","el-priority-of-coverage/p-rule-horizontal-community","el-priority-of-coverage/p-holding-reliance-exhaustion","el-priority-of-coverage/p-holding-jpi-inequitable","el-priority-of-coverage/p-fact-os-concedes","el-priority-of-coverage/p-fact-os-policy","el-priority-of-coverage/p-fact-os-limits","el-priority-of-coverage/p-text-os-insuring","el-priority-of-coverage/p-text-ace-insuring","el-priority-of-coverage/p-text-ace-defense","el-priority-of-coverage/p-text-af-coverage","el-priority-of-coverage/imp-ace-excess-over-os"],"to":"sub-ohio-second","text":"Under horizontal exhaustion all primary policies (Hartford, then Ohio Security) must exhaust before the Ace and American Fire excess policies attach, and an indemnity agreement cannot reorder primary and excess layers."},{"id":"el-priority-of-coverage/i4-a-same-level","scheme":"precedent_holding","from":["el-priority-of-coverage/p-holding-rossmoor-same-level","el-priority-of-coverage/p-holding-rossmoor"],"to":"sub-ace-before-american-fire","text":"Because Rossmoor governs disputes between carriers on the same level, it decides priority between the two excess carriers."},{"id":"el-priority-of-coverage/i4-a-rossmoor-analogy","scheme":"precedent_analogy","from":["el-priority-of-coverage/p-holding-rossmoor","el-priority-of-coverage/p-fact-ace-policy","el-priority-of-coverage/p-text-ace-schedule","el-priority-of-coverage/p-fact-af-policy","el-priority-of-coverage/p-text-lease-indemnity","el-priority-of-coverage/p-text-ace-other-insurance","el-priority-of-coverage/p-text-af-other-insurance","el-priority-of-coverage/imp-competing-excess-clauses"],"to":"sub-ace-before-american-fire","text":"Applying Rossmoor at the excess level, the indemnitor's excess carrier (Ace) is ahead of the indemnitee's own excess carrier (American Fire)."},{"id":"el-priority-of-coverage/i4-a-jpi","scheme":"precedent_analogy","from":["el-priority-of-coverage/p-holding-jpi","el-priority-of-coverage/p-text-lease-insurance","el-ace-additional-insured","el-priority-of-coverage/imp-competing-excess-clauses"],"to":"sub-ace-before-american-fire","text":"As in JPI, once the indemnitee's primary pays, the indemnitor's excess carrier contributes before the indemnitee's excess, so Ace precedes American Fire."},{"id":"el-priority-of-coverage/i4-element","scheme":"rule_application","from":["sub-hartford-primary","sub-ohio-second","sub-ace-before-american-fire","el-priority-of-coverage/imp-carson-covered-each"],"to":"el-priority-of-coverage","text":"Combining the three rulings yields the order Hartford, Ohio Security, Ace, American Fire."}],"premises":[{"id":"el-hartford-duty-to-defend/p-rule-broad-duty","text":"A liability insurer owes a broad duty to defend its insured against claims that create a potential for indemnity.","kind":"rule","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-rule-potential-test","text":"The test is whether the underlying action potentially seeks relief within the coverage of the policy.","kind":"rule","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-rule-insured-burden","text":"The insured need only show that the underlying claim may fall within policy coverage; the insurer must prove it cannot.","kind":"rule","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-rule-duration","text":"The duty to defend is discharged only when the action is concluded or the policy is exhausted.","kind":"rule","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-rule-defend-all","text":"Once the defense duty attaches the insurer must defend all claims, covered and noncovered, until it produces undeniable evidence allocating defense costs to a noncovered claim; any doubt is resolved in the insured's favor.","kind":"rule","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-text-insuring-agreement","text":"Hartford Policy Coverage A insuring agreement: Hartford will pay sums the insured is legally obligated to pay as damages for bodily injury and has the right and duty to defend the insured against any suit seeking those damages.","kind":"text","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-hartford-policy","text":"Hartford issued general liability policy no. 41 CSE S30502 (Jan. 1, 2016 to Jan. 1, 2017) to Ashley Furniture.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-text-ai-written-contract","text":"Hartford Policy Section II(6): persons or organizations are additional insureds when the named insured agreed in a written contract that they be added as additional insureds, provided the injury occurs after the contract is executed.","kind":"text","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-text-lessors-of-land","text":"Hartford Policy Lessors of Land provision: any person or organization from whom the named insured leases land or premises is an additional insured, but only with respect to liability arising out of the ownership, maintenance or use of that part of the land or premises leased to the named insured.","kind":"text","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-lease","text":"On January 17, 2012 Carson Madrona (landlord) leased its warehouse at 6195 Coliseum Way, Oakland to Warehouse and Delivery Solutions, Inc. dba Ashley Furniture (tenant).","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-assignment","text":"WDS's rights under the Lease were later assigned to Stoneledge Furniture, LLC dba Ashley Furniture Homestore.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-text-lease-electrical","text":"Lease: the tenant must maintain electrical systems to the extent located within the Premises (the brief renders this as 'within the [Warehouse]' and labels it Article 6).","kind":"text","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-text-lease-indemnity","text":"Lease Article 18: tenant shall indemnify, hold harmless and defend landlord against claims arising out of or in any way connected with (a) tenant's use of the Premises or (b) the conduct of tenant's business or anything done or permitted by tenant in or about the Premises.","kind":"text","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-text-lease-insurance","text":"Lease Article 23.1: tenant must carry CGL insurance insuring tenant and landlord against liability for personal injury arising out of the operation, maintenance, use or occupancy of the Premises.","kind":"text","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-incident","text":"The incident occurred on May 17, 2016 at the warehouse at 6195 Coliseum Way.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-arc-flash","text":"While replacing a fuse during the repair, Perez was burned in an arc flash at the electrical installation.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-allegations","text":"The Perezes alleged that the cross-defendants, including Ashley Furniture and Carson Madrona, failed to maintain the electrical power distribution system and knew or should have known it was prone to unexpected arcing.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-ashley-employee-called","text":"An Ashley Furniture employee (Gary Mountain) called Perez to the premises to perform electrical repairs.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-use-reason-present","text":"Ashley Furniture's use of the Warehouse is the reason Perez was at the premises where he was injured.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-mdp-supplied-ashley","text":"The Main Distribution Panel that exploded was supplying power to the premises for Ashley Furniture's business; the switch Perez serviced supplied Ashley's units.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-mdp-central","text":"The MDP was the property's centralized source of power to all tenant spaces, with a dedicated pullout switch per tenant; the switch supplying Ashley's units had the wrong voltage rating.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-shared-control","text":"The Perezes contended at trial that Ashley shared responsibility and control over its supply in the MDP (24/7 access required by the National Electrical Code) and was directly and vicariously liable for failures to inspect and maintain the MDP.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-tender","text":"Ohio Security tendered Carson Madrona's defense and indemnity to Ashley Furniture/Hartford in 2016 and 2017 under the Lease and as an additional insured under the Lessors of Land provision.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-ror-2020","text":"In its March 2020 reservation of rights letter Hartford agreed to defend Carson Madrona as an additional insured under the Lessors of Land provision.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-ror-2022","text":"In September 2022 Hartford confirmed Carson Madrona is an additional insured with regard to liability out of the ownership, maintenance or use of the part of the premises leased to Ashley.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-hartford-defended","text":"Hartford provided Carson Madrona a defense in the Underlying Lawsuit until it withdrew after the verdict.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-verdict-carson","text":"The jury found Carson Madrona negligent and a substantial factor in Perez's harm and allocated it 50% of responsibility (SanOak 50%).","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-verdict-ashley","text":"The jury found Ashley Furniture negligent but not a substantial factor in causing Perez's harm, and assigned it 0% of responsibility; no damages were awarded against Ashley.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-judgment","text":"Judgment was entered on the verdict on August 7, 2023 (total verdict $25,500,000).","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-withdrawal","text":"On September 11, 2023, after verdict and judgment, Hartford through counsel withdrew its defense of Carson Madrona, stating it had no continuing defense obligation and no indemnity obligation.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-withdrawal-reason","text":"Hartford's stated reason included that the jury did not hold its named insured Ashley Furniture responsible for Perez's injuries.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-appeal","text":"Carson Madrona timely appealed the judgment (Court of Appeal No. A169103), so the action was not concluded when Hartford withdrew.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-fact-settlement","text":"The Underlying Lawsuit settled on September 30, 2024, funded by Carson Madrona, Ohio Security and American Fire with no contribution from Hartford or Ace.","kind":"fact","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-rule-arising-out-of","text":"'Arising out of' in insurance provisions is read broadly; it imports no particular standard of causation or theory of liability and requires only a minimal causal connection or incidental relationship.","kind":"rule","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-holding-vitton","text":"That an accident is not attributable to the named insured's negligence is irrelevant when the additional insured endorsement does not allocate or restrict coverage according to fault.","kind":"holding","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-holding-truck-fault","text":"Where a tenant's policy named the landlord as additional insured for liability arising out of the tenant's use of the property, coverage applied regardless of the tenant's fault.","kind":"holding","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-holding-american-casualty","text":"An additional insured covered for 'liability arising out of' the named insured's operations was entitled to full defense and indemnity even where it was solely liable.","kind":"holding","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-holding-truck-use","text":"In Truck, the tenant's coverage of the landlord applied because the tenant's use of the premises was the reason the injured customers were present, even though the tenant won summary judgment (no liability) in the underlying suit.","kind":"holding","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-holding-hartford-casualty","text":"A landlord covered 'only with respect to' the tenant's operations or facilities was an additional insured for an after-hours fall from a deck outside the leased premises; only a minimal causal connection to the tenant's business presence in the building is required.","kind":"holding","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/p-holding-syufy","text":"'Arising out of' establishes a broad 'but for' test; injury on a defective hatch the worker had to pass to reach the job was covered, and the owner's own negligence was irrelevant because the policy did not address fault.","kind":"holding","implicit":false,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-lessee-is-named-insured","text":"The lessee under the Lease (WDS, later Stoneledge \u2014 'Ashley Furniture') is 'you' (a Named Insured) under the Hartford Policy, whose declared named insured is Ashley Furniture Industries Inc.; the broad form named insured endorsement extends named-insured status to subsidiaries.","kind":"text","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-lease-written-contract","text":"The Lease is a written contract, executed in 2012 before the 2016 injury, in which Ashley agreed that Carson Madrona be insured on its liability policy, satisfying the written-contract precondition of Section II(6).","kind":"text","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-occurrence-in-period","text":"The May 17, 2016 occurrence falls within the Hartford Policy period (1/1/16\u20131/1/17).","kind":"fact","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-mdp-within-use","text":"Liability for an explosion at the building's centralized MDP (which Hartford asserted was in a common area outside Ashley's leased premises) nonetheless 'arises out of the use of that part of the premises leased to' Ashley, because Ashley's use of its units is why Perez was there and the switch supplied Ashley's units.","kind":"fact","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-not-fault-based-endorsement","text":"Carson Madrona's additional-insured status is governed by the Lessors of Land provision rather than by the Hartford Policy's blanket 'Additional Insured \u2013 Designated Person or Organization' endorsement, which limits coverage to injury 'caused, in whole or in part, by your acts or omissions' (Section II(6) excludes anyone included as an insured by an endorsement).","kind":"text","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-lease-in-force","text":"Ashley's Lease obligations to indemnify Carson Madrona and to procure insurance for it were in force and had not been released (Hartford's withdrawal letter relies on a December 21, 2017 Lease Termination Agreement that the brief does not address).","kind":"fact","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-not-exhausted","text":"Hartford had not exhausted its limits by paying judgments or settlements when it withdrew, so exhaustion did not end its defense duty.","kind":"fact","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-appeal-is-defense","text":"The duty to defend continues through an appeal from an adverse judgment, i.e., the action is not 'concluded' at verdict or entry of judgment.","kind":"rule","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-hartford-duty-to-defend/imp-potential-persisted","text":"After the verdict there remained at least a potential that Carson Madrona's liability was covered, so Hartford lacked undeniable evidence that the claim was outside coverage.","kind":"rule","implicit":true,"claim":"el-hartford-duty-to-defend"},{"id":"el-recovery-defense-amounts/p-fact-withdrawal","text":"Following the verdict Hartford withdrew its defense of Carson Madrona on September 11, 2023.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-os-funded-appeal","text":"Because of Hartford's withdrawal, Ohio Security assumed Carson Madrona's defense, including prosecution of the appeal, and incurred and paid $352,686.77 in attorney's fees between the September 11, 2023 withdrawal and the September 30, 2024 settlement.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-os-defended","text":"Ohio Security defended Carson Madrona after Hartford abandoned the defense.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-text-supp-intro","text":"Hartford's Supplementary Payments are owed 'with respect to any claim we investigate or settle, or any \"suit\" against an insured we defend', and do not reduce limits.","kind":"text","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-text-supp-costs","text":"Hartford Supplementary Payments (e): Hartford will pay all costs taxed against the insured in the suit.","kind":"text","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-rule-supp-defense","text":"Under California law the duties in a policy's supplementary payments provision are part of the insurer's defense duty (otherwise costs would fall under indemnity and effectively rewrite the policy limit).","kind":"rule","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-holding-prichard","text":"A supplementary payments provision with the same language 'is a function of the defense obligation, not its indemnity obligation'; there the insurer owed a duty to defend at least one claim.","kind":"holding","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-holding-mintarsih","text":"Accord: supplementary-payment obligations for costs flow from the defense duty.","kind":"holding","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-costs-memo","text":"The Perezes filed a memorandum of costs seeking $238,582.00 in costs.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-costs-order","text":"On November 9, 2023 the court denied Carson Madrona's motion to tax costs and awarded the Perezes the full $238,582.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-os-paid-costs","text":"Ohio Security paid the $238,582 in costs awarded to the Perezes as part of funding the settlement.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-text-supp-pji","text":"Hartford Supplementary Payments (g): all interest on the full amount of any judgment that accrues after entry of judgment and before Hartford has paid, offered to pay, or deposited in court the part of the judgment within its limit.","kind":"text","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-rule-pji-rate","text":"Post-judgment interest accrues on an unpaid judgment at 10% per year.","kind":"rule","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-judgment-date","text":"Judgment was entered against Carson Madrona on August 7, 2023, with interest at 10% per annum from the date of judgment.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-offer-limits","text":"On August 13, 2024 Ohio Security and American Fire offered to pay their combined policy limits, terminating further post-judgment interest responsibility.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/p-fact-pji-paid","text":"The settlement included payment of $1,100,000 in post-judgment interest accrued from judgment to August 13, 2024.","kind":"fact","implicit":false,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/imp-reimbursement-right","text":"An insurer that pays its insured's defense after a co-insurer wrongfully withdraws may recover those sums directly from the breaching insurer (by contribution or subrogation); the brief asserts entitlement without citing the doctrine.","kind":"rule","implicit":true,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/imp-fees-reasonable","text":"The $352,686.77 in appellate fees were reasonable and necessary defense expenses within the scope of Hartford's defense obligation and attributable to Carson Madrona's defense.","kind":"fact","implicit":true,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/imp-supp-despite-withdrawal","text":"Hartford's Supplementary Payments obligations, which by their terms apply to a suit against an insured 'we defend', attach even after Hartford stopped defending, because its withdrawal was a breach.","kind":"rule","implicit":true,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/imp-hartford-no-offer","text":"Hartford never paid, offered to pay, or deposited in court the part of the judgment within its limit, so interest under its clause ran on the full judgment until the August 13, 2024 offer.","kind":"fact","implicit":true,"claim":"el-recovery-defense-amounts"},{"id":"el-recovery-defense-amounts/imp-pji-amount-matches","text":"The $1,100,000 paid equals the post-judgment interest Hartford's clause would cover for the relevant period, and Ohio Security (and American Fire) actually bore it.","kind":"fact","implicit":true,"claim":"el-recovery-defense-amounts"},{"id":"el-ace-additional-insured/p-fact-ace-policy","text":"Ace issued Commercial Umbrella Liability Policy G2793742500 001 (Jan. 1, 2016 to Jan. 1, 2017) to Ashley Furniture.","kind":"fact","implicit":false,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/p-text-ace-schedule","text":"The Ace Policy's Schedule of Underlying Insurance lists the Hartford general liability policy no. 41 CSE S30502 as underlying insurance.","kind":"text","implicit":false,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/p-text-ace-who-insured","text":"Ace Policy Section II.B.6: any person or organization is an insured 'if insured under \"underlying insurance\"', provided Ace's coverage for that insured is no broader than the underlying insurance coverage.","kind":"text","implicit":false,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/p-fact-certificate","text":"A Hartford certificate of insurance names Carson Madrona as an additional insured under the Hartford Policy.","kind":"fact","implicit":false,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/p-holding-reliance","text":"Absent express contrary provisions on additional-insured status, an additional insured under the primary policy is also an additional insured under the follow-form excess policy.","kind":"holding","implicit":false,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/imp-ace-follow-form","text":"The Ace umbrella policy is a 'follow form' excess policy as to who is an insured, so Reliance National's rule governs it.","kind":"text","implicit":true,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/imp-ace-no-contrary","text":"Nothing in the Ace Policy (including its endorsements) expressly withholds insured status from persons who are additional insureds under the Hartford Policy.","kind":"text","implicit":true,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/imp-no-broader","text":"Carson Madrona's insured status under Ace extends only as far as its Hartford coverage, so the ruling depends on Carson being covered under Hartford for the Perez liability itself (not merely being named on a certificate).","kind":"rule","implicit":true,"claim":"el-ace-additional-insured"},{"id":"el-ace-additional-insured/imp-ace-occurrence-in-period","text":"The May 17, 2016 occurrence falls within the Ace policy period.","kind":"fact","implicit":true,"claim":"el-ace-additional-insured"},{"id":"el-priority-of-coverage/p-holding-rossmoor","text":"Where an indemnitor agreed to indemnify the indemnitee and procured insurance naming it, the indemnitee's own (direct) insurer is excess to the additional-insured coverage in the indemnitor's policy; apportioning under other-insurance clauses would negate the indemnity agreement, so indemnity and subrogation rights control and the indemnitor's policy is primary.","kind":"holding","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-holding-rossmoor-same-level","text":"The Rossmoor rule applies to disputes between carriers on the same level of risk (primary vs. primary or excess vs. excess).","kind":"holding","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-lease-indemnity","text":"Lease Article 18 requires Ashley to indemnify Carson Madrona for liability arising from or connected with its use of the Warehouse.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-lease-primary","text":"Lease Article 23.1: the insurance Ashley obtains must be primary and non-contributing, meaning Carson may look solely to it for a covered claim and need not claim under any other insurance it may have.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-lease-insurance","text":"Lease Article 23.1 requires Ashley to procure liability insurance insuring Carson Madrona.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-fact-certificate","text":"Hartford issued a certificate of insurance to Carson Madrona naming it as additional insured.","kind":"fact","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-os-excess","text":"Ohio Security Policy Other Insurance b.(1)(b): the Ohio Security insurance is excess over any other primary insurance available to Carson Madrona covering liability for premises or operations for which it has been added as an additional insured.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-fact-hartford-limits","text":"The Hartford Policy has a $2 million per occurrence and $4 million general aggregate limit.","kind":"fact","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-fact-os-policy","text":"Ohio Security issued primary CGL policy BLS (16) 56862638 (Aug. 31, 2015 to Aug. 31, 2016) to Carson Madrona.","kind":"fact","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-fact-os-limits","text":"The Ohio Security Policy has a $1 million per occurrence and $2 million general aggregate limit.","kind":"fact","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-os-insuring","text":"Ohio Security Coverage A: pays sums the insured is legally obligated to pay for bodily injury and has the right and duty to defend.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-fact-os-concedes","text":"Ohio Security acknowledges that, as to indemnity, its policy attaches before the Ace and American Fire excess policies.","kind":"fact","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-rule-horizontal-padilla","text":"California's horizontal exhaustion rule requires all primary insurance to be exhausted before an excess insurer must drop down to defend.","kind":"rule","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-rule-horizontal-community","text":"An excess or secondary policy does not cover a loss, nor does any defense duty arise, until all primary insurance has been exhausted.","kind":"rule","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-holding-reliance-exhaustion","text":"A primary insurer cannot rely on its insured's subrogation rights to modify the order of exhaustion prescribed by policy language.","kind":"holding","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-holding-jpi-inequitable","text":"It is inequitable to reverse the priority of coverage and alter the basic rules of primary and excess coverage based on an insured's agreement with a third party.","kind":"holding","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-fact-ace-policy","text":"Ace issued an excess (umbrella) policy to the indemnitor Ashley Furniture with $25,000,000 per occurrence and aggregate limits.","kind":"fact","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-ace-schedule","text":"The Ace Policy lists the Hartford Policy as its underlying insurance.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-ace-insuring","text":"Ace pays on behalf of the insured sums in excess of the 'retained limit'.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-ace-defense","text":"Ace's duty to defend arises when damages would be covered by underlying insurance but for exhaustion of its limits by payment of loss.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-ace-other-insurance","text":"Ace Other Insurance condition: if valid and collectible other insurance applies, Ace is excess of it and will not contribute, unless the other insurance is written to be excess of Ace.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-fact-af-policy","text":"American Fire issued excess policy ESA 56862638 to the indemnitee Carson Madrona with $10,000,000 limits, applying in excess of the underlying limits.","kind":"fact","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-af-coverage","text":"American Fire pays loss in excess of the 'Underlying Limits of Insurance' in Item 5 and follows the 'first underlying insurance' (the Ohio Security policy).","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-text-af-other-insurance","text":"American Fire Other Insurance condition: if other insurance applies, American Fire is excess of it, unless the other insurance is specifically written to be excess of American Fire.","kind":"text","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/p-holding-jpi","text":"In JPI (indemnitee JPI named as additional insured on subcontractor RJS's primary and with RJS also carrying an umbrella), after the indemnitee's primary carrier pays, the indemnitor's excess carrier is obliged to contribute.","kind":"holding","implicit":false,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/imp-hartford-own-other-insurance","text":"The Lease/Rossmoor allocation controls notwithstanding the Hartford Policy's own Other Insurance condition, which as amended by the 'Amendment \u2013 Other Insurance Condition' endorsement states the Hartford insurance is excess over any other insurance except insurance bought specifically to apply in excess of it (an endorsement Hartford's withdrawal letter invoked and the brief does not address).","kind":"text","implicit":true,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/imp-indemnity-covers-claim","text":"The Perez liability is within the Lease indemnity (not excepted as caused by Carson's gross negligence or willful misconduct), so Rossmoor's indemnity-based rationale applies.","kind":"fact","implicit":true,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/imp-lease-in-force","text":"Ashley's indemnity and insurance-procurement obligations under the Lease remained enforceable (not released by any later lease termination).","kind":"fact","implicit":true,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/imp-ace-excess-over-os","text":"The Ohio Security policy is 'other insurance' (not 'underlying insurance') under the Ace Policy, so Ace's Other Insurance clause places Ace excess over Ohio Security.","kind":"text","implicit":true,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/imp-competing-excess-clauses","text":"Where the Ace and American Fire excess policies each declare themselves excess of other insurance, the conflict is resolved by the Lease indemnity (Rossmoor/JPI) rather than by pro rata sharing.","kind":"rule","implicit":true,"claim":"el-priority-of-coverage"},{"id":"el-priority-of-coverage/imp-carson-covered-each","text":"Carson Madrona is covered for the Perez liability under each of the four policies, so ranking them is necessary (depends on the additional-insured rulings).","kind":"fact","implicit":true,"claim":"el-priority-of-coverage"}],"attacks":[{"id":"str-1","type":"undercut","target":"el-hartford-duty-to-defend/i1-element","lane":"structure","severity":"critical","rank":1,"text":"Hartford's September 11, 2023 letter withdrew the defense on three independent grounds: the blanket 'Additional Insured - Designated Person or Organization' endorsement limiting coverage to injury caused by Ashley's acts or omissions, the December 21, 2017 Lease Termination Agreement releasing Ashley's lease obligations (including the duty to procure insurance), and the Amendment - Other Insurance Condition. The brief characterizes the withdrawal as resting 'among other things' on the no-damages-against-Ashley point and answers only that one ground. A movant on a no-genuine-dispute standard cannot obtain a breach ruling while leaving two independent, record-documented coverage defenses unaddressed; each alone defeats the inference that the duty persisted."},{"id":"rec-1","type":"undermine","target":"el-hartford-duty-to-defend/imp-not-fault-based-endorsement","lane":"record","severity":"critical","rank":2,"text":"The brief never confronts the Hartford Policy's blanket 'Additional Insured - Designated Person or Organization' endorsement, whose Schedule reads 'BLANKET WHERE REQUIRED BY WRITTEN CONTRACT OR AGREEMENT' and which covers only injury 'caused, in whole or in part, by your acts or omissions.' Section II(6) - the very provision the brief quotes, minus this sentence - says no one is an insured under the Lessors of Land paragraph if it is included as an insured by an endorsement. Because the Lease is the written contract that would make Carson an endorsement insured, Carson's coverage is the fault-based endorsement coverage, not the fault-neutral Lessors of Land grant on which the brief's entire no-fault argument depends."},{"id":"auth-1","type":"undermine","target":"el-hartford-duty-to-defend/imp-not-fault-based-endorsement","lane":"authority","severity":"critical","rank":3,"text":"The brief silently assumes Carson's status rests on the Lessors of Land clause, but Section II(6) says no one is an insured 'under this provision' if it is included as an insured by an endorsement, and the blanket CG 20 26 endorsement (where required by written contract) picks up Carson through the Lease. Under California law an endorsement that conflicts with or limits the policy body controls, and Ohio Security's own premise cites Aerojet for the duty rules while ignoring that same rule. Once the endorsement governs, Carson is covered only for injury 'caused, in whole or in part, by' Ashley's acts or omissions, and the brief offers no reading under which the Lessors of Land clause survives."},{"id":"str-2","type":"undercut","target":"el-hartford-duty-to-defend/i1-nofault-analogy","lane":"structure","severity":"critical","rank":4,"text":"Truck, Vitton and American Casualty involve endorsements that do not allocate coverage by fault; the Hartford Policy contains a blanket CG 20 26 endorsement covering contract-required additional insureds 'only with respect to' injury 'caused, in whole or in part, by your acts or omissions', and Section II(6) provides that no one is an insured under the Lessors of Land provision if included as an insured by an endorsement. The brief never shows that Carson's status is governed by the fault-neutral Lessors of Land clause rather than the fault-based endorsement, so its no-fault syllogism rests on an undefended implicit premise. With the jury allocating Ashley 0%, the difference is outcome-determinative, and Truck itself flags it (AMCO 'did not write its additional insured endorsement to bar coverage where the tenant was not at fault')."},{"id":"rec-2","type":"rebut","target":"sub-no-fault-requirement","lane":"record","severity":"critical","rank":5,"text":"Even if fault mattered only 'in part,' the record forecloses it: the jury answered 'No' to whether Ashley's negligence was a substantial factor, assigned Ashley 0% (Carson and SanOak 50% each), and the judgment orders that the Perezes 'take nothing' from Stoneledge. Under the endorsement's 'caused, in whole or in part, by your acts or omissions' language, a binding finding that the named insured did not cause the harm defeats additional-insured coverage, and the brief's footnote that the jury found Ashley 'negligent' is irrelevant to causation."},{"id":"auth-2","type":"rebut","target":"sub-no-fault-requirement","lane":"authority","severity":"critical","rank":6,"text":"The governing CG 20 26 language ('caused, in whole or in part, by your acts or omissions') is fault-based: courts construing it hold it requires that the named insured be a proximate cause, not a but-for cause, and that it is not the equivalent of 'arising out of'. A N.D. Cal. court applying California law likewise read this wording to reach only liabilities traceable to the named insured's own acts or omissions. The jury expressly found Ashley's negligence was not a substantial factor and assigned it 0% responsibility, so on this record the additional-insured grant is not satisfied and the no-fault premise of the motion fails as a matter of law."},{"id":"str-3","type":"undermine","target":"el-hartford-duty-to-defend/imp-lease-in-force","lane":"structure","severity":"critical","rank":7,"text":"Every route to Carson's additional-insured status (Section II(6) requires a written contract and lasts 'only for that period of time required by the contract or agreement') and to Hartford's primacy (Rossmoor's indemnity rationale) presupposes that Ashley's Lease obligations were still in force. Hartford's withdrawal letter, which the brief itself cites, invokes a December 21, 2017 Lease Termination Agreement in which Ashley and Carson released 'any and all obligations' related to the Lease. The brief never mentions the release, so the premise on which both the duty-to-defend element and the priority element depend is unestablished and genuinely disputed."},{"id":"rec-3","type":"undermine","target":"el-hartford-duty-to-defend/imp-mdp-within-use","lane":"record","severity":"critical","rank":8,"text":"The brief assumes the explosion at the MDP arose from use of 'that part of the land or premises leased to' Ashley, but the record places the MDP outside the leased premises: Carson Madrona's own motion states the MDP 'is located in the property's exterior common area, outside of the Leased Premises' and was accessed without Carson's permission, and Hartford's 2022 letter records the plaintiffs' position that the panel was in the common area and Carson's to maintain. The Lessors of Land grant is expressly limited to the leased part of the premises, so on this record there is at least a genuine dispute that defeats summary judgment."},{"id":"auth-3","type":"undercut","target":"el-hartford-duty-to-defend/i1-nofault-rule","lane":"authority","severity":"critical","rank":9,"text":"Read in full, the brief's own no-fault authorities state their rule only for endorsements that do not allocate coverage by fault, and they expressly recognize insurers may write fault-limited endorsements. Vitton's operative sentence, which the brief quotes, is conditioned on the endorsement 'not purport[ing] to allocate or restrict coverage according to fault'; Syufy says insurers are 'free to' limit coverage to the named insured's negligence; American Casualty applies its rule only 'in the absence of contrary policy language.' Hartford's CG 20 26 endorsement is exactly that contrary, fault-allocating language, so the cited line of cases supports Hartford, not the motion."},{"id":"str-4","type":"undercut","target":"el-hartford-duty-to-defend/i1-ai-arising-out-of","lane":"structure","severity":"critical","rank":10,"text":"Truck, Hartford Casualty and Syufy construe clauses keyed to the tenant's use or operations; the Lessors of Land clause is limited to liability arising out of 'that part of the land or premises leased to you', a location limiter the brief never construes. The brief's own facts place the explosion at the building's Main Distribution Panel, 'the property's centralized source of electrical power to all tenant spaces', and Hartford's 2022 letter records the plaintiffs' position that it sat in a common area outside Ashley's premises. Whether the MDP is part of the premises leased to Ashley is at minimum a genuine factual dispute that precludes summary judgment on additional-insured status."},{"id":"rec-4","type":"undercut","target":"el-hartford-duty-to-defend/i1-ai-lease-consistent","lane":"record","severity":"critical","rank":11,"text":"The brief rewrites Lease Section 6.2 by replacing 'within the Premises' with '[Warehouse]', a term it defines as the entire 6195 Coliseum Way building, and drops the opening carve-out 'Except for those items expressly required to be maintained by Landlord under Section 6.1.' The Lease defines 'Premises' as only Units A-D and Lot 2, and Section 6.1 makes the Landlord responsible for 'the common areas of the Project.' Read as written, the Lease assigns the common-area MDP to Carson, not Ashley, so it contradicts rather than supports the brief's reading of the Lessors of Land grant."},{"id":"auth-4","type":"undercut","target":"el-hartford-duty-to-defend/i1-breach","lane":"authority","severity":"critical","rank":12,"text":"The brief truncates Aerojet: the same passage says the defense duty 'may be extinguished earlier, if it is shown that no claim can in fact be covered,' and that such extinguishment operates prospectively. Montrose, also cited by the brief, says the duty lasts until the suit is concluded 'or until it has been shown that there is no potential for coverage.' Hartford withdrew only after a special verdict fixed Ashley's non-causation, which (under the fault-based endorsement) eliminated any potential for coverage; a pending appeal by Carson does not revive a potential that the verdict already foreclosed as to Ashley's causal role."},{"id":"str-5","type":"undermine","target":"el-recovery-defense-amounts/imp-reimbursement-right","lane":"structure","severity":"critical","rank":13,"text":"The brief asserts that Ohio Security 'is entitled to reimbursement' of 100% of the fees, costs and interest but cites no doctrine (contribution, subrogation or otherwise) that shifts a co-insurer's entire payment onto Hartford. Ohio Security is Carson's own primary insurer with its own duty to defend and an identical supplementary-payments clause, and it concedes priority only 'with regard to the duty to indemnify', leaving its own defense duty concurrent with Hartford's. Between co-insurers who each owed a defense, the recovery is at most equitable contribution, so the full-reimbursement relief exceeds what the elements establish."},{"id":"rec-5","type":"undermine","target":"el-priority-of-coverage/imp-hartford-own-other-insurance","lane":"record","severity":"critical","rank":14,"text":"The brief's priority scheme assumes Hartford is primary, but the Hartford Policy's 'Amendment - Other Insurance Condition' endorsement replaces the base Other Insurance clause: Hartford is 'excess over any other insurance, whether primary, excess, contingent or on any other basis,' and it also replaces condition 2.e so that an additional insured must submit the claim to its own insurer, deleting the base-form exception for contracts requiring primary and non-contributory coverage. Hartford's 2022 and 2023 letters both invoked this endorsement, and the brief does not mention it. A lease promise between Ashley and Carson cannot rewrite the policy Hartford actually issued."},{"id":"auth-5","type":"undercut","target":"el-hartford-duty-to-defend/i1-nofault-analogy","lane":"authority","severity":"major","rank":15,"text":"The Truck/Syufy analogy turns on 'arising out of' wording; under acts-or-omissions wording California courts hold that a worker's presence at the site because of the named insured's business is not enough. Advent affirmed summary judgment for the insurer under the identical 'caused, in whole or in part' form because mere presence did not show causation by the named insured, and Associated Industries (N.D. Cal.) distinguished Syufy precisely because the acts-or-omissions limitation was absent there. The brief's facts (Ashley's employee called Perez; Ashley's use explains his presence) are presence facts, and the jury rejected Ashley's causal negligence."},{"id":"str-6","type":"undercut","target":"el-priority-of-coverage/i4-h-lease-primary","lane":"structure","severity":"critical","rank":16,"text":"The Lease's demand that Ashley's insurance be 'primary and non-contributing' binds Ashley, not Hartford; priority among insurers is fixed by the policies. The Hartford Policy's 'Amendment - Other Insurance Condition' makes Hartford's insurance excess over any other insurance, removes its defense duty where another insurer has one, and requires an additional insured to submit the claim to its other insurer. The brief never addresses this endorsement, though Hartford's withdrawal letter put it squarely in issue, so its reading is not the only reasonable one and the question-of-law ruling on primacy cannot issue."},{"id":"rec-6","type":"undercut","target":"el-hartford-duty-to-defend/i1-element","lane":"record","severity":"critical","rank":17,"text":"Even if a defense duty attached, the same endorsement provides that when Hartford's insurance is excess, 'we will have no duty under this Coverage Part to defend the insured against any \"suit\" if any other insurer has a duty to defend.' Ohio Security, Carson's own primary CGL insurer with an unconditional duty to defend, was such an insurer, and the record shows it declined to participate in Carson's defense. Hartford's post-verdict decision to stop funding the defense therefore cannot be a breach as a matter of law."},{"id":"auth-6","type":"undercut","target":"el-hartford-duty-to-defend/i1-ai-arising-out-of","lane":"authority","severity":"major","rank":18,"text":"Even under the Lessors of Land clause, coverage is limited to liability arising out of 'that part of the land or premises leased to you,' and the brief's own facts place the explosion at the building's centralized MDP serving all tenants, which Hartford flagged as a common area under Carson's control. Hartford Casualty, the brief's key analogy, extended coverage beyond the leased space only because that endorsement reached 'facilities owned or used by you' and expressly did not limit coverage to the lease description of premises. California courts enforce tenant obligations confined to the leased suite and not common areas, so a genuine dispute at minimum exists on the location element."},{"id":"str-7","type":"undercut","target":"el-ace-additional-insured/i3-apply","lane":"structure","severity":"critical","rank":19,"text":"The Ace argument rests on a single, unsupported sentence: 'It is undisputed that Carson Madrona is an additional insured under the Hartford Policy.' Hartford disputes exactly that (its letter calls Carson an 'Alleged Additional Insured' and says it 'continues to dispute' coverage), the only cited support is a certificate of insurance, and Ace's insured clause makes Ace coverage 'no broader than coverage provided by underlying insurance'. Ace status is therefore wholly derivative of the contested Hartford coverage question, and the brief's Hartford section argued only a defense-stage potential for coverage, not actual coverage of the Perez liability."},{"id":"rec-7","type":"undermine","target":"el-priority-of-coverage/imp-lease-in-force","lane":"record","severity":"critical","rank":20,"text":"Rossmoor's priority rule rests on an enforceable indemnity bargain, but the record shows Carson released it: Carson's own motion concedes that in the December 2017 Lease Termination Agreement 'the parties released one another from all obligations under the Lease except for specified obligations not relevant here,' and Hartford's withdrawal letter quotes the release of 'any and all obligations ... arising directly or indirectly out of ... the Premises or the Lease.' With no surviving indemnity or insurance-procurement obligation, the 'compelling factor' in Rossmoor is absent, and the brief does not address the release at all."},{"id":"auth-7","type":"undermine","target":"el-hartford-duty-to-defend/imp-potential-persisted","lane":"authority","severity":"major","rank":21,"text":"The brief assumes a post-verdict potential for coverage persisted, but California law lets an insurer prove the absence of coverage on undisputed extrinsic facts and lets coverage be tested against the underlying jury's special findings. Here the special verdict answered 'No' to whether Ashley's negligence was a substantial factor, which is the very fact the fault-based endorsement turns on. That is undisputed extrinsic evidence negating any potential for coverage, not the speculation the potential-for-coverage test protects."},{"id":"auth-8","type":"undercut","target":"el-recovery-defense-amounts/i2-costs-law","lane":"authority","severity":"major","rank":22,"text":"Prichard and Mintarsih, the brief's own authorities, tie supplementary payments to the defense duty and to claims at least potentially covered: Prichard limited the costs claim to those insureds who were owed a defense, and Mintarsih refused costs flowing from claims with no potential for coverage. Hartford's clause applies only to a 'suit' against an insured 'we defend.' If the defense duty ended when the verdict negated Ashley's causation, the taxed costs (awarded after the November 2023 order, post-withdrawal) fall outside the clause."},{"id":"rec-9","type":"rebut","target":"sub-ace-before-american-fire","lane":"record","severity":"critical","rank":23,"text":"The Ace Policy itself defines its attachment point. 'Retained limit' means the total limits of 'underlying insurance' and 'any applicable limit of \"other insurance\" providing coverage to the insured,' so Ace pays only above Hartford plus every other policy covering Carson, including Ohio Security and American Fire. American Fire, by contrast, is written to attach directly above Ohio Security, its only scheduled 'first underlying insurance.' On the policy language, Ace cannot sit beneath American Fire."},{"id":"str-8","type":"undercut","target":"el-priority-of-coverage/i4-a-rossmoor-analogy","lane":"structure","severity":"moderate","rank":24,"text":"The brief contradicts itself. To place Ohio Security ahead of Ace it invokes Reliance National and JPI for the rule that it is 'inequitable to reverse the priority of coverage ... based on an insured's agreement with a third party'; to place Ace ahead of American Fire, and Hartford ahead of Ohio Security, it relies on exactly such an agreement, the Ashley-Carson Lease. Both cannot hold. If a private indemnity agreement cannot reorder layers, the Rossmoor analogy fails; if it can, the horizontal-exhaustion section loses its premise."},{"id":"rec-8","type":"undermine","target":"el-hartford-duty-to-defend/imp-lease-in-force","lane":"record","severity":"moderate","rank":25,"text":"Additional-insured status under Section II(6) lasts 'only for that period of time required by the contract or agreement' (a sentence the brief left out of its quotation), and the Lease requires coverage only 'within the Term of this Lease and for so long as it occupies the Premises.' The Lease was terminated, and every Lease obligation released, in December 2017, years before the 2023 verdict and appeal. Whether any contractual requirement still supported additional-insured status during the post-verdict period is at minimum disputed, and the brief offers no evidence on it."},{"id":"str-9","type":"undercut","target":"el-hartford-duty-to-defend/i1-ai-lease-consistent","lane":"structure","severity":"moderate","rank":26,"text":"The brief bolsters coverage by quoting the Lease as requiring Ashley to maintain 'electrical systems to the extent located within the [Warehouse]', but the Lease actually says 'within the Premises', which is the leased space. Read as written, the Lease assigns electrical systems outside Ashley's premises (such as the building's central MDP) away from Ashley, and Article 18's indemnity excludes injury caused by Landlord's gross negligence or by other tenants' acts in connection with the Common Area Access. Read consistently with the Lease, the provision points against coverage, not for it."},{"id":"auth-9","type":"undermine","target":"el-recovery-defense-amounts/imp-reimbursement-right","lane":"authority","severity":"major","rank":27,"text":"The brief asks for 100% reimbursement of appellate fees without naming a doctrine. Between coinsurers the remedy is equitable contribution, which apportions a loss so each pays a fair share, not full shifting to one carrier; and Ohio Security owed its own named insured a defense. Arrowood also holds the nonparticipating insurer may defeat contribution by proving the absence of actual coverage, which the special verdict supplies here, so the amount and even the existence of any recovery are disputed."},{"id":"str-10","type":"undercut","target":"el-priority-of-coverage/i4-a-jpi","lane":"structure","severity":"moderate","rank":28,"text":"As the brief itself recounts JPI, only the indemnitor (RJS) carried an umbrella; the indemnitee JPI had a primary policy and no excess policy. JPI therefore ranked the indemnitor's excess against the indemnitee's primary, which says nothing about ranking two competing excess policies. Ace and American Fire each declare themselves excess of other insurance, and the brief offers no authority resolving such mutually repugnant excess clauses by the indemnity agreement instead of by pro rata sharing."},{"id":"rec-10","type":"undermine","target":"el-hartford-duty-to-defend/imp-lessee-is-named-insured","lane":"record","severity":"moderate","rank":29,"text":"The Lessors of Land grant reaches only persons from whom 'you' (a Named Insured) lease premises, but the tenant was WDS and then Stoneledge, and neither is a named insured on policy 41 CSE S30502. The Broad Form Named Insured endorsement names Ashley Furniture Industries, Sam's Appliances and Ashcomm, plus subsidiaries, and no record evidence shows that WDS or Stoneledge is a subsidiary. Hartford's complaint calls Stoneledge only an 'affiliate.' Ace's schedule also lists separate Hartford general liability policies for 'Ashley Home Stores' (41 CSE S30702) and 'Ashley Distribution Services' (41 CSE S30802), so the tenant may be insured, if at all, under a different policy that is not in the record."},{"id":"auth-10","type":"undercut","target":"el-priority-of-coverage/i4-a-same-level","lane":"authority","severity":"major","rank":30,"text":"The brief cites Reliance National for the proposition that Rossmoor governs carrier-priority disputes, but Reliance held Rossmoor 'is not controlling' in a disp
