ute between primary and excess carriers and enforced the policies' own language instead. JPI involved an indemnitor found 70% at fault, which is not this case, where the indemnitor was found 0% responsible. Neither case supports using the Lease indemnity to reorder coverage in Carson's favor once Ashley's causal fault was rejected."},{"id":"str-11","type":"undercut","target":"el-priority-of-coverage/i4-element","lane":"structure","severity":"moderate","rank":31,"text":"A four-tier priority ruling presupposes that Carson is covered for the Perez liability under each policy (the implicit premise that Carson is covered under each policy). The brief establishes at most a duty to defend based on a potential for coverage under Hartford; it never shows actual indemnity coverage under Hartford (whose additional-insured grant is location-limited and allegedly fault-based) or under Ace, whose coverage is no broader than Hartford's. Ranking policies whose coverage for the loss is unresolved is advisory, and the element does not follow from the three sub-issues."},{"id":"rec-11","type":"undercut","target":"el-hartford-duty-to-defend/i1-ai-hartford-admission","lane":"record","severity":"moderate","rank":32,"text":"The letters do not 'specifically acknowledge' that Carson is an additional insured. The March 30, 2020 letter (which the brief misdates March 20) agreed to defend 'subject to a full reservation of The Hartford's rights to deny or limit coverage,' and reserved the right to withdraw if Hartford determined there was no coverage. The September 30, 2022 letter (misdated September 20) recorded evidence that the panel was in the common area and was Carson's to maintain. By July 2023 Hartford stated in writing that 'Carson is not an additional insured.' A defense under reservation is not a concession, so the inference of an admission fails."},{"id":"str-12","type":"undercut","target":"el-recovery-defense-amounts/i2-costs-apply","lane":"structure","severity":"moderate","rank":33,"text":"Hartford's Supplementary Payments run only to 'any \"suit\" against an insured we defend'; the costs were taxed on November 9, 2023, after Hartford had stopped defending, and Prichard involved an insurer actually defending. The brief's implicit premise that the clause attaches despite withdrawal is never defended. The brief's own theory also cuts against it: if supplementary payments are part of the defense duty, Ohio Security's identical clause made the taxed costs Ohio Security's own defense obligation, which leaves contribution at most rather than a full shift to Hartford."},{"id":"rec-12","type":"undermine","target":"el-priority-of-coverage/imp-indemnity-covers-claim","lane":"record","severity":"moderate","rank":34,"text":"The brief assumes the Perez liability falls within Article 18, but the record shows Ashley itself rejected that: Ashley accepted the tender and then in December 2019 withdrew from Carson's defense, 'asserting that the Underlying Lawsuit did not allege claims within the scope of the defense/indemnity provision of the Lease.' Article 18's catch-all reaches only 'occurrences on the Premises,' and the arc flash occurred at a common-area panel outside the Premises after a jury found Carson's own negligence caused the harm. Whether the indemnity applies at all is disputed, so Rossmoor's indemnity-based reasoning cannot be applied on summary judgment."},{"id":"str-13","type":"undercut","target":"el-hartford-duty-to-defend/i1-ai-hartford-admission","lane":"structure","severity":"moderate","rank":35,"text":"The brief treats Hartford's reservation-of-rights letters as an admission of additional-insured status. The 2020 letter defends 'subject to a full reservation' of rights, and the 2022 letter states that Carson is not an additional insured for claims arising from its own negligence or from areas outside Ashley's leased premises, flagging the MEP common-area evidence. A defense under reservation is not a concession, and the jury's later finding of 50% Carson fault with Ashley at 0% fits the exact limitation Hartford reserved."},{"id":"rec-13","type":"undermine","target":"el-recovery-defense-amounts/imp-fees-reasonable","lane":"record","severity":"moderate","rank":36,"text":"The only evidence of the $352,686.77 is a single sentence that Ohio Security 'incurred' that amount 'in connection with the Appeal.' Cossalter does not say when the fees were incurred (the brief's September 11, 2023 to September 30, 2024 window has no record source), whether they were reasonable or necessary, or whether any of them concerned SanOak, whom Ohio Security also insured and defended and who also appealed. Cossalter also swears the appeal was funded 'under the Ohio Security Policy,' that is, in performance of Ohio Security's own duty to defend its named insured, which it had earlier declined to do."},{"id":"str-14","type":"rebut","target":"relief-psj","lane":"structure","severity":"moderate","rank":37,"text":"The brief's statement of the summary-judgment standard addresses only a movant without the trial burden, which can prevail by pointing to an 'absence of evidence'. Ohio Security and American Fire seek affirmative declarations and money on their own claims, so they must establish every element beyond reasonable dispute. The brief instead treats contested points (the MDP's location, whether the Lease survived, which additional-insured grant governs, and how the fees and interest were reasonably incurred and allocated) as settled, so the requested relief outruns what the elements establish."},{"id":"rec-14","type":"undercut","target":"el-recovery-defense-amounts/i2-costs-apply","lane":"record","severity":"moderate","rank":38,"text":"Ohio Security's own policy has the same supplementary-payments promise: 'All court costs taxed against the insured in the \"suit\",' and 'All interest on the full amount of any judgment' until it offers its limits. Ohio Security says it defended Carson and funded the appeal under its own policy, so the costs and post-judgment interest it paid discharged its own contractual obligations to its named insured. They are not sums Hartford alone owed, and at most they could support contribution between co-insurers, which the brief neither pleads nor allocates."},{"id":"rec-15","type":"undermine","target":"el-recovery-defense-amounts/p-fact-os-paid-costs","lane":"record","severity":"moderate","rank":39,"text":"Cossalter says only that Ohio Security's 'contribution in funding the Settlement included payment of costs'. That describes a share of a negotiated global settlement, not a payment of costs taxed against Carson, and Cossalter does not say how the settlement allocated costs among Carson, SanOak and the insurers. The judgment awarded the Perezes costs against Carson and, separately, against SanOak, who is not a Hartford insured and who was insured and defended by Ohio Security. Nothing in the record ties the $238,582 to costs taxed against Carson alone."},{"id":"rec-16","type":"undermine","target":"el-recovery-defense-amounts/imp-pji-amount-matches","lane":"record","severity":"moderate","rank":40,"text":"Nothing in the record calculates or allocates the $1,100,000. Cossalter says only that the 'Settlement includes payment' of that interest, and the settlement was funded jointly by Carson, Ohio Security and American Fire. The judgment against Carson was $12.75 million in several liability, not the $25.5 million the brief describes, and Carson's own motion puts the accruing interest at about $3.56 million a year, a figure that cannot be reconciled with $1.1 million. The brief also cites Exhibit 19 for an August 13, 2024 limits offer, but Lam identifies Exhibit 19 as a letter dated August 29, 2024."},{"id":"rec-17","type":"undermine","target":"el-hartford-duty-to-defend/p-fact-judgment","lane":"record","severity":"moderate","rank":41,"text":"The brief repeatedly says a '$25,500,000 judgment' was entered 'against Carson Madrona.' The judgment actually entered is several: $10,250,000 to David Perez and $2,500,000 to Donna Perez against Carson, with matching separate awards against SanOak, which no one contends Hartford insures. Every downstream figure the brief seeks (post-judgment interest on 'the full amount of any judgment' and taxed costs) must be measured against the $12.75 million judgment against Carson, and the brief makes no such showing."},{"id":"rec-18","type":"undercut","target":"el-priority-of-coverage/i4-h-consistent","lane":"record","severity":"moderate","rank":42,"text":"Ohio Security's 'excess' clause applies only over 'other primary insurance' for which Carson has been added as an additional insured, but the Hartford Policy as endorsed is expressly excess over any other insurance. The two policies therefore present competing excess clauses, not a consistent 'Hartford first' structure. The certificate offered as corroboration is, in the record, a blank page bearing only a Bates number."},{"id":"rec-19","type":"undercut","target":"el-ace-additional-insured/i3-read-clause","lane":"record","severity":"moderate","rank":43,"text":"Ace's 'who is an insured' clause covers a person insured under the underlying insurance only on the condition that Ace's coverage 'will be no broader than coverage provided by \"underlying insurance\"'. Ace therefore imports every limitation in the Hartford Policy, including the fault-based blanket additional-insured endorsement and the time limit tied to the released Lease, and its coverage rises or falls with Hartford's. Hartford's counsel also identified Federal Insurance Company as the excess carrier 'above the primary level Hartford Policy,' which undermines the brief's premise that Ace sits immediately above Hartford."},{"id":"auth-11","type":"undermine","target":"el-hartford-duty-to-defend/p-holding-american-casualty","lane":"authority","severity":"minor","rank":44,"text":"American Casualty does not hold that an additional insured is covered regardless of the endorsement's terms: the insurer there conceded the injury was covered, and the only question was whether Civil Code section 2782 or the indemnity agreement barred enforcement. The opinion's rule is expressly bounded by 'the absence of contrary policy language.' It says nothing about a CG 20 26 endorsement that conditions coverage on the named insured's acts or omissions."},{"id":"auth-12","type":"undercut","target":"el-hartford-duty-to-defend/i1-ai-hartford-admission","lane":"authority","severity":"minor","rank":45,"text":"Hartford's letters are not admissions of unconditional additional-insured status: the 2020 letter defended under a full reservation and expressly reserved the right to withdraw if Hartford determined there was no coverage, and the 2022 letter limited Carson's status and flagged the common-area MDP. California law treats a defense that has properly arisen as extinguishable once no claim can be covered, so defending under reservation before the verdict is consistent with withdrawing afterward."},{"id":"str-15","type":"undermine","target":"el-recovery-defense-amounts/imp-pji-amount-matches","lane":"structure","severity":"minor","rank":46,"text":"The $1,100,000 interest figure is supported only by a citation to the Hartford Policy, with no computation tying it to Hartford's clause, which covers interest only until Hartford pays or offers 'the part of the judgment that is within the applicable limit'. The brief also shifts parties: the element claims recovery for Ohio Security, but the interest request is made for 'Ohio Security and American Fire', and American Fire never defended and is not shown to have paid a separately identified share. Without proof of who bore what amount, the interest award is not established beyond genuine dispute."},{"id":"rec-20","type":"undercut","target":"el-priority-of-coverage/i4-h-analogy","lane":"record","severity":"minor","rank":47,"text":"Rossmoor turned on an owner who bargained for the contractor's insurance so that its own insurer would not bear the loss. This Lease is different in a relevant way: it makes the tenant pay its pro rata share of the Landlord's own liability-insurance premiums as Additional Rent, and it requires that the Landlord be a 'named insured' on a policy covering only the 'Premises.' The tenant thus helped pay for the very Carson coverage the brief would push to second position, and the Lease never provided for Hartford to be primary for common-area liability."}],"rulings":{"str-1":{"exposure":"contested","reason":"The redraft now names and answers the withdrawal grounds, but the September 11, 2023 letter actually states four (the 'Third' ground is CG 20 26's limit to coverage 'required by the contract', measured against a released Lease). Whether each ground fails as a matter of law turns on the endorsement, release and other-insurance questions ruled on separately, several of which remain disputed.","move":"redraft"},"rec-1":{"exposure":"open","reason":"Section II(6) plainly says no one is an insured 'under this provision' if 'included as an insured by an endorsement', and the blanket CG 20 26 endorsement amends Who Is An Insured to 'include' every person whose AI status is required by written contract; the Lease is that contract. The nullification argument fails because II(6) is a generic form grant that a policy-specific endorsement may displace (this policy also schedules named CG 20 11 lessors elsewhere), the limitation appears in the very paragraph creating the grant, and Haynes says the endorsement prevails. Hartford's earlier reliance on the Lessors of Land wording came under full reservation and does not rewrite the policy.","move":"redraft"},"auth-1":{"exposure":"open","reason":"Same issue as rec-1: no conflict-of-terms analysis is needed because the policy body's own cross-reference sends contract-required additional insureds to the endorsement. The response's reading effectively adds 'named' to the cross-reference, and the timing of Hartford's 'recent review' does not waive a provision under express non-waiver and reservation language.","move":"rebut"},"str-2":{"exposure":"open","reason":"Because CG 20 26 governs (rec-1), the Truck/Vitton/American Casualty no-fault analogy does not carry over to a grant that conditions coverage on the named insured's acts or omissions. The response's alternative route, that potential coverage under CG 20 26 survived while appeals were pending, is a separate breach question addressed under auth-4 and auth-7; it does not save this analogy.","move":"reroute"},"rec-2":{"exposure":"open","reason":"Under the governing 'caused, in whole or in part' language, the special verdict ('No' on Ashley's substantial-factor question, 0% to Ashley and 0% to Perez) defeats indemnity coverage, and Ohio Security's own declarant concedes the finding (Cossalter para. 9). The edited sentence fixes the 'does negate' typo, but the no-fault proposition it supports fails, and 'negligent' plus presence facts do not create a causation dispute.","move":"undercut"},"auth-2":{"exposure":"open","reason":"The movant concedes there is no indemnity coverage as a matter of law if CG 20 26 governs, and the court has held that it does (rec-1). The no-fault sub-issue therefore fails, and the concession reaches the indemnity-dependent relief.","move":"concede"},"str-3":{"exposure":"contested","reason":"The timing answer largely holds for additional-insured status: this is an occurrence policy, the May 2016 occurrence fell within the Lease term, and the 2017 release between Ashley and Carson, to which Hartford was not a party, does not on its face reach back to divest coverage. But the release does go to the indemnity-based priority theory and to CG 20 26's 'not broader than required by the contract' clause, and the movant concedes the Termination Agreement is not in its record.","move":"rebut"},"rec-3":{"exposure":"contested","reason":"The MDP is undisputedly in an exterior common area (Carson's own motion), and the Lease puts common areas on the landlord. Whether Carson's liability nonetheless 'arose out of' the use of the part leased to Ashley (Ashley's superintendent called Perez about flickering lights in the leased units) is a close interpretive question: it likely supports a potential for coverage, but it is not established for indemnity beyond genuine dispute, and the 'dedicated switch' facts rest on an advocate's trial brief.","move":"redraft"},"auth-3":{"exposure":"open","reason":"The movant accepts that Vitton, Syufy and American Casualty apply only where the grant does not allocate coverage by fault. Because the fault-based CG 20 26 endorsement governs (rec-1), these authorities do not support the no-fault rule as applied here.","move":"rebut"},"str-4":{"exposure":"contested","reason":"Both readings of 'use of that part of the land or premises leased to you' are reasonable: the clause can describe the physical part whose ownership, maintenance or use generates the liability, or the tenant's use under a minimal-causal-connection test. On this record the location limiter is a live dispute for indemnity and for summary judgment on additional-insured status; the response admits as much in its fallback.","move":"rebut"},"rec-4":{"exposure":"open","reason":"The movant concedes it misquoted Lease section 6.2 ('[Warehouse]' for 'Premises') and withdraws its reliance on Ashley's maintenance covenant. Read as written, sections 6.1 and 6.2 put common-area electrical systems on the landlord, so the Lease no longer supports, and if anything cuts against, the brief's reading of the Lessors of Land grant.","move":"redraft"},"auth-4":{"exposure":"contested","reason":"Aerojet and Montrose allow an insurer to end the defense before the action concludes only on undisputed facts that conclusively eliminate any potential for coverage. Under CG 20 26 the special verdict is strong evidence that they did. But the judgment was not final when Hartford withdrew: Hartford's own amended complaint (para. 22) admits that the Perezes, the only parties adverse to Stoneledge, also filed notices of appeal, and the record does not show the scope of those appeals. Whether the potential for coverage was conclusively eliminated is therefore a genuine dispute; the counter's claim that only Carson appealed is wrong on this record.","move":"rebut"},"str-5":{"exposure":"open","reason":"With CG 20 26 governing and Hartford's endorsed other-insurance clause in the policy, Ohio Security has not shown as a matter of law that it was 'not primarily liable', which equitable subrogation under American States requires. It was its own named insured's primary CGL carrier, and its excess clause is at best in conflict with Hartford's. The recovery available on this record is at most equitable contribution, which is a pro rata allocation, not the 100% reimbursement the motion requests.","move":"reroute"},"rec-5":{"exposure":"open","reason":"The Amendment - Other Insurance Condition makes Hartford excess over 'any other insurance ... except when purchased specifically to apply in excess of this insurance', which disposes of the umbrella absurdity argument. Its replacement 2.e also requires an additional insured to submit the claim to its own insurer. The specific-versus-general argument cannot convert this into primary coverage, and the fallback (risk allocation) needs a live indemnity the record shows was released.","move":"redraft"},"auth-5":{"exposure":"open","reason":"Under acts-or-omissions wording, Advent holds that presence at the site is not causation, and the 'more than presence' facts (summoning, escorting, accessing the panel) were before the jury, which still found Ashley's negligence not a substantial factor and Perez 0% at fault. The 'arising out of' analogy does not carry over, so the attack stands as to the analogy. Whether a potential for coverage survived the appeals is ruled on separately.","move":"rebut"},"str-6":{"exposure":"open","reason":"The Lease's 'primary and noncontributing' promise binds Ashley, not Hartford, and Hartford's endorsed clause makes it excess. Read with Ohio Security's clause, the result is either no conflict (Ohio Security primary) or mutually repugnant clauses, where the default is proration. The Rossmoor exception requires an enforceable indemnity the record shows was released (rec-7). Hartford-first priority cannot be declared as a matter of law.","move":"rebut"},"rec-6":{"exposure":"contested","reason":"Read literally, the endorsement's 'no duty to defend if any other insurer has a duty to defend' clause applies, and Ohio Security owed its named insured a defense. But the same clause says 'if no other insurer defends, we will undertake to do so', and when Hartford withdrew no other insurer was defending. Whether the clause excused withdrawal, or only gave Hartford rights against other insurers, is a genuinely close question that bears at least on allocation, so it neither defeats nor confirms breach as a matter of law.","move":"undercut"},"auth-6":{"exposure":"contested","reason":"The movant correctly retreats from Hartford Casualty as a like-for-like analogy, since that endorsement covered 'facilities owned or used by you'. The remaining location question is the same close interpretive dispute as str-4; Article 23.1's 'other grounds serving the Premises' is Ashley's procurement promise, not Hartford's grant, so it does not resolve the dispute.","move":"undercut"},"str-7":{"exposure":"contested","reason":"The 'undisputed' statement was false and is withdrawn. As redrafted, Ace status follows from Carson being an insured under the Hartford Policy at all, not from actual coverage of this loss, because Ace section II.6 sets status and its 'no broader' proviso limits scope, and CG 20 26 still includes Carson as an additional insured. But status under Hartford itself still depends on unresolved predicates, including whether the tenant was a Named Insured (rec-10), so the derivative ruling is not yet established beyond genuine dispute.","move":"redraft"},"rec-7":{"exposure":"open","reason":"Rossmoor's priority rule enforces an existing indemnity right through subrogation (as JPI describes it). Carson's own motion states the 2017 Termination Agreement released 'all obligations under the Lease except for specified obligations not relevant here', and Hartford's letter quotes the release. The movant offers no contrary evidence and concedes the agreement is not in its record. The indemnity predicate for Hartford-first priority is not established.","move":"undercut"},"auth-7":{"exposure":"contested","reason":"Montrose permits an insurer to prove the absence of a potential for coverage on undisputed extrinsic facts, and Arrowood allows coverage to be tested against special findings. Under CG 20 26 the verdict goes directly to the dispositive fact. But Hartford admits the Perezes appealed (Am. Compl. para. 22), and the record does not show whether that appeal reached the take-nothing judgment for Stoneledge, so whether the special verdict had 'conclusively' eliminated the potential for coverage by September 11, 2023 remains genuinely disputed.","move":"rebut"},"auth-8":{"exposure":"contested","reason":"Prichard and Mintarsih tie supplementary payments to the defense duty, not to whether the insurer is actually defending, and an insurer that wrongfully withdraws cannot rely on its own breach. Whether the costs fall within Hartford's clause therefore rises or falls with the contested breach question (auth-4, auth-7, rec-6).","move":"rebut"},"rec-9":{"exposure":"open","reason":"Ace's insuring agreement attaches only above a 'retained limit' that includes 'any applicable limit of other insurance' providing coverage to the insured. American Fire is not insurance 'specifically purchased to be excess' of Ace, so on the text Ace sits above it. Even if the clauses were treated as cancelling, the default is proration, and the indemnitor-first rule needs a live indemnity. The movant concedes this branch lacks supporting authority.","move":"undercut"},"str-8":{"exposure":"closed","reason":"The brief applies one consistent framework: horizontal exhaustion between primary and excess layers (Reliance, JPI) and an indemnity-based rule only within a layer. That answers the charge of internal contradiction; whether Ace and American Fire actually sit on the same level is a separate question resolved under rec-9.","move":"rebut"},"rec-8":{"exposure":"closed","reason":"The 'only for that period of time required by the contract' sentence is satisfied for this occurrence: the Lease required coverage 'at all times within the Term', the May 2016 occurrence fell within the Term and the policy period, and occurrence-based insured status for that event does not lapse because the Lease later ended. The restored quotation of the endorsement cross-reference matters to rec-1, not to timing.","move":"redraft"},"str-9":{"exposure":"contested","reason":"The misquotation is conceded and corrected, and the Article 18 exceptions (landlord's gross negligence, other tenants) do not apply on this record. But the corrected Lease places common-area electrical systems on the landlord, and the remaining supports (Article 18's 'in any way connected with' and Article 23.1) are promises that were disputed in 2019 and released in 2017, so whether the Lease is consistent with coverage remains open to genuine dispute.","move":"redraft"},"auth-9":{"exposure":"open","reason":"Fireman's Fund describes contribution as apportioning a shared loss pro rata, and the movant concedes that contribution would yield only an allocation. Subrogation fails for the reason given under str-5. With CG 20 26 governing, Arrowood's burden on Hartford to disprove actual coverage is likely met by the special findings, at least for indemnity. Full reimbursement is not established.","move":"undercut"},"str-10":{"exposure":"open","reason":"The movant concedes JPI did not rank two excess policies against each other and that it has no case ranking competing umbrellas by an indemnity agreement. The redraft's premise that the clauses 'cancel' leads to the default rule of proration, not to indemnitor first.","move":"redraft"},"rec-10":{"exposure":"contested","reason":"The Lessors of Land and blanket-endorsement grants require that the Named Insured on 41 CSE S30502 be the party that leased the premises. The tenant was Stoneledge (by assignment from WDS), and the record does not prove it is a subsidiary covered by the Broad Form Named Insured endorsement. That endorsement also excludes subsidiaries with similar coverage, and Ace's schedule lists a separate Hartford policy for 'Ashley Home Stores'. Hartford's repeated statements that Stoneledge is its 'direct insured' under this policy number are evidence for the movant. The movant concedes the corporate relationship is unproven, so a genuine dispute remains.","move":"rebut"},"auth-10":{"exposure":"closed","reason":"Reliance held Rossmoor not controlling between primary and excess carriers, which is consistent with the brief's use of it to keep Ohio Security ahead of Ace. JPI's 70% fault allocation mattered there because that indemnity was fault-triggered, while Article 18 is not. The release, which is the real problem for this branch, is ruled on under rec-7.","move":"undercut"},"str-11":{"exposure":"closed","reason":"Recasting the requested ruling as the order in which policies respond 'to the extent each affords coverage' cures the objection that ranking policies with unresolved coverage is advisory. Whether the ordering itself is correct is decided under rec-5, str-6, rec-7 and rec-9.","move":"redraft"},"rec-11":{"exposure":"closed","reason":"The movant withdraws the 'admission' theory and corrects the dates. Because whether Carson is an additional insured turns on the policy text as a matter of law, the reservation-of-rights letters were never necessary to the claim, and their loss as admissions is immaterial; the mistaken dates in Cossalter paras. 7-8 do not affect the outcome either.","move":"redraft"},"str-12":{"exposure":"open","reason":"Ohio Security's own policy promises to pay 'all court costs taxed against the insured' in suits it defends, and the costs were taxed while Ohio Security was defending Carson under its own policy. Without a showing that Ohio Security was not primarily liable (str-5), shifting the full amount to Hartford by subrogation fails, and contribution at most remains.","move":"reroute"},"rec-12":{"exposure":"contested","reason":"Article 18(a)-(b) is broad ('arising out of or in any way connected with' Tenant's use of the Premises and conduct of its business 'in or about the Premises'), and its scope is a contract question for the court. Ashley's 2019 contrary position does not decide it. But because the MDP sits outside the Premises, scope is a close question, and the separate release problem (rec-7) independently prevents the indemnity from supplying Rossmoor's predicate.","move":"rebut"},"str-13":{"exposure":"closed","reason":"The movant drops the 'confirmation' or admission characterization of the 2022 letter, so a defense under reservation is no longer offered as a concession; additional-insured status is decided on the policy text. Whether the verdict fits Hartford's reservation is subsumed in the governing-grant and location rulings.","move":"redraft"},"rec-13":{"exposure":"open","reason":"The movant concedes the $352,686.77 rests on a single conclusory sentence: no invoices, no dates, no showing of reasonableness, and no segregation of work for SanOak, which was also an appellant and Ohio Security's insured. It also concedes the brief's date window has no record source. The amount cannot be fixed, and even a liability-only ruling depends on the reimbursement theory that fails under str-5.","move":"redraft"},"str-14":{"exposure":"closed","reason":"The movant concedes that, as the party with the burden of proof at trial, it must establish every element beyond genuine dispute, and the court applies that standard in any event. The redraft's overstatement of Arrowood's burden shift, which applies only in contribution, does not change the standard the court uses; the substantive gaps are ruled on separately.","move":"redraft"},"rec-14":{"exposure":"open","reason":"Ohio Security's identical supplementary-payments clauses (taxed costs; interest on 'the full amount of any judgment' until it offers its limits) made these payments its own contractual obligations. Under American States, a coinsurer that is primarily liable cannot use subrogation, or the policy's transfer-of-rights clause, to shift them entirely to Hartford.","move":"reroute"},"rec-15":{"exposure":"open","reason":"The movant concedes the record does not show that the $238,582 was taxed against Carson alone, as opposed to Carson and SanOak, or how the global settlement allocated it. That concession is material to the costs award; the fallback request for liability with the amount reserved still depends on the unresolved reimbursement theory.","move":"redraft"},"rec-16":{"exposure":"open","reason":"The $1,100,000 is not computed anywhere and matches neither 10% on the $12.75 million several judgment (about $1,299,452 for 372 days) nor the $25.5 million figure. The record also conflicts on the offer date (Cossalter: August 13; Exhibit 19: an August 29 letter) and on who paid what. The movant concedes and reserves the amount, so the figure cannot be awarded.","move":"redraft"},"rec-17":{"exposure":"closed","reason":"The edit correctly describes a $25.5 million verdict on which a several judgment of $12,750,000 was entered against Carson; the counter does not dispute it. The fact as corrected is accurate, and downstream calculation problems are addressed under rec-16.","move":"redraft"},"rec-18":{"exposure":"open","reason":"The movant concedes that the certificate in the record is a blank Bates-stamped page, and that the Ohio Security and Hartford other-insurance clauses conflict. With the certificate gone and the clauses either conflicting or making Hartford excess, there is no consistent 'Hartford first' structure, and the risk-allocation fallback rests on a released indemnity (rec-7).","move":"redraft"},"rec-19":{"exposure":"closed","reason":"The 'no broader than underlying insurance' proviso limits the scope of Ace's coverage, not whether Carson is an insured, so it does not defeat Ace status (though it imports Hartford's limitations, including CG 20 26). Coverage counsel's reference to a Federal excess policy bears on the excess tower and priority, not on Ace's insured definition, and is noted for the priority ruling.","move":"undercut"},"auth-11":{"exposure":"closed","reason":"The corrected parenthetical now carries American Casualty's qualifier, 'in the absence of contrary policy language', so the brief characterizes the holding accurately. Whether it applies here depends on rec-1.","move":"redraft"},"auth-12":{"exposure":"closed","reason":"The movant concedes that the reservation-of-rights letters are not admissions and drops the 'cannot seriously dispute' line; the breach argument no longer depends on them. The concession is immaterial to the outcome, which turns on the policy text and on whether the post-verdict potential for coverage persisted.","move":"redraft"},"str-15":{"exposure":"open","reason":"The movant concedes the $1,100,000 has no computation, no allocation among Ohio Security, American Fire and Carson, and no showing of American Fire's separate payment, so the amount cannot be fixed on summary judgment.","move":"concede"},"rec-20":{"exposure":"closed","reason":"Section 20.2 passes the landlord's project-wide insurance costs through to the tenant; it is not an agreement that Carson's insurer would bear claims connected with the tenant's use. The operative allocation is Article 23.1's 'primary and noncontributing' requirement, so this distinction does not defeat the Rossmoor analogy. The release problem is decided separately under rec-7.","move":"rebut"}},"status":[{"premises":{"el-hartford-duty-to-defend/p-rule-broad-duty":"supported","el-hartford-duty-to-defend/p-rule-potential-test":"supported","el-hartford-duty-to-defend/p-rule-insured-burden":"supported","el-hartford-duty-to-defend/p-rule-duration":"supported","el-hartford-duty-to-defend/p-rule-defend-all":"supported","el-hartford-duty-to-defend/p-text-insuring-agreement":"supported","el-hartford-duty-to-defend/p-fact-hartford-policy":"supported","el-hartford-duty-to-defend/p-text-ai-written-contract":"supported","el-hartford-duty-to-defend/p-text-lessors-of-land":"supported","el-hartford-duty-to-defend/p-fact-lease":"unanchored","el-hartford-duty-to-defend/p-fact-assignment":"supported","el-hartford-duty-to-defend/p-text-lease-electrical":"supported","el-hartford-duty-to-defend/p-text-lease-indemnity":"supported","el-hartford-duty-to-defend/p-text-lease-insurance":"supported","el-hartford-duty-to-defend/p-fact-incident":"supported","el-hartford-duty-to-defend/p-fact-arc-flash":"supported","el-hartford-duty-to-defend/p-fact-allegations":"unanchored","el-hartford-duty-to-defend/p-fact-ashley-employee-called":"unanchored","el-hartford-duty-to-defend/p-fact-use-reason-present":"unanchored","el-hartford-duty-to-defend/p-fact-mdp-supplied-ashley":"sealed","el-hartford-duty-to-defend/p-fact-mdp-central":"sealed","el-hartford-duty-to-defend/p-fact-shared-control":"sealed","el-hartford-duty-to-defend/p-fact-tender":"unanchored","el-hartford-duty-to-defend/p-fact-ror-2020":"supported","el-hartford-duty-to-defend/p-fact-ror-2022":"supported","el-hartford-duty-to-defend/p-fact-hartford-defended":"unanchored","el-hartford-duty-to-defend/p-fact-verdict-carson":"supported","el-hartford-duty-to-defend/p-fact-verdict-ashley":"supported","el-hartford-duty-to-defend/p-fact-judgment":"unanchored","el-hartford-duty-to-defend/p-fact-withdrawal":"supported","el-hartford-duty-to-defend/p-fact-withdrawal-reason":"unanchored","el-hartford-duty-t 	const mix = (a, b, f) => d3.interpolateRgb(color(a), color(b))(f);
	if (t < T.under) return [s(0), color(s(0))];
	if (t < T.after) return [s(1), mix(s(0), s(1), clamp((t - T.under) / 0.8))];
	return [s(2), mix(s(1), s(2), clamp((t - T.after) / 0.8))];
}
const EXP = { open: "--bad", contested: "--contest", closed: "--ok" };

/* ---------- render a moment ---------- */
let now = 0;
function render(t) {
	now = t;
	const muted = css("--rule"), bad = css("--bad"), panel = css("--paper");
	link.attr("stroke", muted).attr("opacity", (l) => clamp((t - l.target.appear) / 0.5));
	node.attr("opacity", (n) => clamp((t - n.appear) / 0.4)).each(function (n) {
		const [, c] = statusAt(n.data.id, t);
		const implicit = n.kind === "premises" && P.get(n.data.id).implicit;
		const hit = marks.some((m) => m.t === n && t > m.start + T.fly && t < m.start + T.fly + 0.5);
		d3.select(this).attr("fill", implicit ? panel : c).attr("stroke", c)
			.attr("transform", `translate(${n.px},${n.py}) scale(${hit ? 1.9 : 1})`);
	});
	lbl.attr("opacity", (n) => clamp((t - n.appear - 0.3) / 0.5));
	atkMark.each(function (m) {
		const p = ease(clamp((t - m.start) / T.fly));
		const [x, y] = [m.from[0] + (m.to[0] - m.from[0]) * p, m.from[1] + (m.to[1] - m.from[1]) * p];
		const ruled = t >= m.rule && m.ruling;
		const c = ruled ? d3.interpolateRgb(bad, css(EXP[m.ruling.exposure]))(clamp((t - m.rule) / 0.4)) : bad;
		const fade = ruled && m.ruling.exposure === "closed" ? 1 - 0.6 * clamp((t - m.rule) / 0.6) : 1;
		const ang = Math.atan2(m.to[1] - m.from[1], m.to[0] - m.from[0]) * 180 / Math.PI + 90;
		d3.select(this).attr("opacity", t < m.start ? 0 : fade).attr("fill", c).attr("transform", `translate(${x},${y}) rotate(${ang})`);
		d3.select(atkLine.nodes()[m.k]).attr("x1", x).attr("y1", y).attr("x2", m.t.px).attr("y2", m.t.py).attr("stroke", c)
			.attr("stroke-dasharray", { undermine: "", undercut: "4 3", rebut: "1 3" }[m.a.type])
			.attr("opacity", t < m.start + T.fly * 0.6 ? 0 : fade * 0.8);
	});
	narrate(t);
	scrub.value = t;
	document.getElementById("clock").textContent = `${t.toFixed(1)}s of ${T.end.toFixed(0)}s`;
}

/* ---------- the running account ---------- */
const $ = (id) => document.getElementById(id);
function tally(t) {
	const p = t < T.under ? 0 : t < T.after ? 1 : 2, c = {};
	Object.values(D.status[p].claims).forEach((s) => (c[s] = (c[s] ?? 0) + 1));
	return ["secure", "exposed", "lost"].map((s) => `<div style="--t:${color(s)}"><b>${c[s] ?? 0}</b><span>${s} claims</span></div>`).join("");
}
let last = "";
function narrate(t) {
	const act = [...ACTS].reverse().find(([s]) => t >= s)[1];
	let head, ev = "";
	if (t < T.a0) {
		head = "The brief, as filed, broken into its typed parts.";
		ev = `<span class="meta">The structure</span>${D.claims.length} claims, ${D.inferences.length} inferences and ${D.premises.length} premises, ${D.premises.filter((p) => p.implicit).length} of them unstated assumptions the brief relies on.`;
	} else if (t < T.r0) {
		const k = Math.min(N - 1, Math.floor((t - T.a0) / T.step)), m = marks[k];
		head = t < T.under ? `Attack ${k + 1} of ${N} lands.` : `All ${N} verified attacks have landed.`;
		ev = `<span class="meta">#${m.a.rank}, ${m.a.lane} lane, ${m.a.type}s ${({ claims: "a claim", inferences: "an inference", premises: "a premise" })[m.t.kind]}, ${m.a.severity}</span>${short(m.a.text, 330)}`;
	} else if (t < T.verdict) {
		const k = Math.min(N - 1, Math.floor((t - T.r0) / T.rStep)), m = marks[k], r = m.ruling;
		head = t < T.after ? "The defence answers, the other side counters, the judge rules." : "After the exchange, the motion still fails on its core.";
		ev = r ? `<span class="meta">Ruling on #${m.a.rank}: ${r.exposure}${r.move ? `, after a ${r.move}` : ""}</span>${short(r.reason, 330)}` : "";
	} else {
		const open = D.round6.rulings.filter((r) => r.exposure === "open").length;
		head = `Replayed against the court’s real reasons, ${open} of ${D.round6.rulings.length} still defeat the hardened brief.`;
		ev = `<span class="meta">Round 6, a counterfactual</span>${short(D.round6.bottomLine ?? "", 400)}`;
	}
	const key = act + head + ev;
	if (key === last) return; last = key;
	$("act").textContent = act; $("headline").textContent = head; $("event").innerHTML = ev; $("tally").innerHTML = tally(t);
}

/* ---------- legend ---------- */
const sym = (type, fill, stroke) => `<svg viewBox="-9 -7 18 14"><path d="${d3.symbol(type, 60)()}" fill="${fill}" stroke="${stroke}"></path></svg>`;
const dash = (d) => `<svg viewBox="0 0 18 14"><line x1="1" y1="7" x2="17" y2="7" stroke="currentColor" stroke-width="1.5" stroke-dasharray="${d}"></line></svg>`;
function legend() {
	const ink = css("--muted"), paper = css("--paper");
	$("legend").innerHTML = [
		[sym(d3.symbolCircle, ink, ink), "Claim. The relief sits at the centre, then elements, then sub-issues."],
		[sym(d3.symbolDiamond, ink, ink), "Inference: one step of reasoning, typed by its scheme."],
		[sym(d3.symbolSquare, ink, ink), "Premise. A hollow square is unstated."],
		[sym(d3.symbolTriangle, css("--bad"), "none"), "Attack, pointing at what it hits."],
		[dash(""), "Undermines a premise"], [dash("4 3"), "Undercuts an inference"], [dash("1 3"), "Rebuts a claim"],
		...["holds", "weak", "contested", "lost"].map((s) => [`<svg viewBox="0 0 18 14"><rect x="3" y="2" width="12" height="10" rx="2" fill="${color(s)}"></rect></svg>`, { holds: "Holds", weak: "Weak or unproven", contested: "Contested", lost: "Lost or broken" }[s]]),
	].map(([a, b]) => a + `<span>${b}</span>`).join("");
}

/* ---------- interaction ---------- */
const tip = $("tip");
let pinned = null;
function describe(d) {
	if (d.a) { const r = d.ruling; return `<p class="act">Attack #${d.a.rank}, ${d.a.lane}, ${d.a.type}, ${d.a.severity}</p><p class="prose">${d.a.text}</p>${r && now >= d.rule ? `<p><b>Ruling: ${r.exposure}.</b> ${r.reason}</p>` : ""}`; }
	const id = d.data.id, k = d.kind, [s] = statusAt(id, now);
	const what = k === "claims" ? { relief: "Relief sought", element: "Element", sub_issue: "Sub-issue" }[C.get(id).level] : k === "inferences" ? `Inference, ${words(I.get(id).scheme)}` : P.get(id).implicit ? "Unstated premise" : `Premise, ${P.get(id).kind}`;
	const n = marks.filter((m) => m.t === d && now > m.start).length;
	return `<p class="act">${what}: ${s}${n ? `, ${n} attack${n > 1 ? "s" : ""}` : ""}</p><p class="prose">${text(id)}</p>`;
}
function hover(ev, d) {
	const box = $("graph").getBoundingClientRect();
	tip.hidden = false; tip.innerHTML = describe(d);
	tip.style.left = Math.min(ev.clientX - box.left + 12, box.width - 310) + "px"; tip.style.top = (ev.clientY - box.top + 12) + "px";
}
[node, atkMark].forEach((sel) => sel.on("mousemove", hover).on("mouseleave", () => (tip.hidden = true))
	.on("click", (ev, d) => { pinned = d; $("detail").innerHTML = describe(d); })
	.on("keydown", (ev, d) => { if (ev.key === "Enter") { pinned = d; $("detail").innerHTML = describe(d); } }));

/* ---------- playback ---------- */
const scrub = $("scrub"); scrub.max = T.end;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing = false, speed = 1, lastTs = 0;
function frame(ts) {
	if (!playing) return;
	const dt = lastTs ? (ts - lastTs) / 1000 : 0; lastTs = ts;
	const t = Math.min(T.end, now + dt * speed);
	render(t);
	if (t >= T.end) return setPlaying(false);
	requestAnimationFrame(frame);
}
function setPlaying(p) {
	playing = p; lastTs = 0; $("play").textContent = p ? "Pause" : now >= T.end ? "Replay" : "Play";
	if (p) { if (now >= T.end) render(0); requestAnimationFrame(frame); }
}
$("play").onclick = () => setPlaying(!playing);
$("speed").onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; $("speed").textContent = `${speed}×`; };
scrub.oninput = () => { setPlaying(false); render(+scrub.value); };
$("marks").innerHTML = ACTS.map(([s, l]) => `<button style="left:${(s / T.end) * 100}%" data-t="${s}">${l}</button>`).join("");
$("marks").onclick = (e) => { const b = e.target.closest("button"); if (b) { setPlaying(false); render(+b.dataset.t + 0.01); } };
document.addEventListener("keydown", (e) => { if (e.key === " " && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { legend(); last = ""; render(now); });

legend();
// Reduced motion: open on the final state; otherwise open on the full graph and start playing.
if (reduce) render(T.end); else { render(T.filed); setPlaying(true); }
</script>
