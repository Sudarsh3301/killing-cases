<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matter Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
	--paper:#eef1f3; --panel:#f9fafb; --ink:#15202b; --muted:#56636f; --rule:#cbd3da;
	--ok:#1f7a6d; --warn:#a86b12; --contest:#6455a3; --bad:#9b1d30; --info:#4a6f8a;
	--serif:"Newsreader", Georgia, serif; --sans:"Public Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
	--paper:#10161c; --panel:#161e26; --ink:#e4e9ee; --muted:#93a1ae; --rule:#2a3540;
	--ok:#4db6a4; --warn:#e0a84a; --contest:#a898e0; --bad:#e26375; --info:#86a9c4;
} }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 var(--sans); height:100vh; display:flex; flex-direction:column; }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
[data-tone="ok"] { --t:var(--ok); } [data-tone="warn"] { --t:var(--warn); } [data-tone="contest"] { --t:var(--contest); }
[data-tone="bad"] { --t:var(--bad); } [data-tone="info"] { --t:var(--info); }

/* Header: the matter, the phase switch, and the claim strip */
header { padding:12px 16px 10px; border-bottom:1px solid var(--rule); background:var(--panel); display:grid; gap:10px; }
.bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
h1 { font:600 20px/1.2 var(--serif); margin:0; }
select, input[type=search] { font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:5px 8px; }
input[type=search] { min-width:200px; flex:1; max-width:320px; }
.phases { display:inline-flex; border:1px solid var(--ink); border-radius:999px; overflow:hidden; margin-left:auto; }
.phases button { border:0; background:transparent; padding:6px 14px; font-weight:500; }
.phases button[aria-checked="true"] { background:var(--ink); color:var(--panel); }
.phases button:disabled { opacity:.35; cursor:default; }
.strip { display:flex; gap:3px; align-items:center; }
.strip button { width:22px; height:10px; border:0; border-radius:2px; background:var(--t); padding:0; transition:background-color .35s; }
.strip span { color:var(--muted); margin-left:8px; }
.caption { color:var(--muted); font-size:13px; margin:0; }

/* Two panes */
main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 460px; }
.left { overflow:auto; padding:0 20px 40px; }
#inspector { overflow:auto; border-left:1px solid var(--rule); background:var(--panel); padding:16px 18px 40px; }
@media (max-width: 960px) { body { height:auto; } main { grid-template-columns:1fr; } #inspector { border-left:0; border-top:1px solid var(--rule); } }

.tabs { position:sticky; top:0; z-index:2; background:var(--paper); display:flex; gap:18px; border-bottom:1px solid var(--rule); padding-top:10px; }
.tabs button { border:0; background:none; padding:6px 0 8px; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; }
.tabs button[aria-selected="true"] { color:var(--ink); border-color:var(--ink); }
.legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin:12px 0 4px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; background:var(--t); margin-right:5px; vertical-align:-1px; }

/* The argument map */
.claim { margin-top:10px; }
.kids { margin-left:14px; padding-left:14px; border-left:2px solid var(--rule); }
.node { display:block; width:100%; text-align:left; border:1px solid var(--rule); border-left:4px solid var(--t); border-radius:4px; background:var(--panel); padding:8px 10px; transition:border-color .35s, background-color .35s, opacity .2s; }
.node:hover { background:color-mix(in srgb, var(--t) 6%, var(--panel)); }
.node .txt { font-family:var(--serif); }
.claim > .node .txt { font-size:15.5px; }
.lvl-relief > .node .txt { font-size:19px; font-weight:500; }
.lvl-element > .node .txt { font-weight:500; }
.chip { display:inline-block; font:600 11px/1.6 var(--sans); color:var(--t); background:color-mix(in srgb, var(--t) 12%, transparent); border-radius:4px; padding:0 6px; margin-right:8px; vertical-align:2px; transition:color .35s, background-color .35s; }
.notch { float:right; font-size:12px; font-weight:600; color:var(--t); margin-left:10px; }
.beam { margin:6px 0 0 18px; }
.beam > .node { border-style:solid dashed dashed solid; border-left-style:solid; padding:6px 10px; }
.beam > .node .txt { font-size:14px; }
.scheme { display:block; font-size:12px; color:var(--muted); }
.pips { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 4px 14px; }
.pip { width:15px; height:15px; border-radius:3px; border:2px solid var(--t); background:var(--t); padding:0; transition:background-color .35s, border-color .35s; }
.pip.implicit { background:transparent; }
.pip[data-hit="open"] { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--bad); }
.pip[data-hit="contested"] { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--contest); }
.selected { outline:2px solid var(--ink); outline-offset:2px; }
.dim { opacity:.25; }
@keyframes ping { 0%,100% { box-shadow:0 0 0 0 transparent; } 40% { box-shadow:0 0 0 6px color-mix(in srgb, var(--bad) 35%, transparent); } }
.targeted { animation:ping 1.1s ease-out 2; }

/* Lists: attacks, redline, replay */
.filters { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; align-items:center; }
.filters b { font-weight:600; color:var(--muted); font-size:12px; margin:0 4px 0 8px; }
.toggle { border:1px solid var(--rule); background:var(--panel); border-radius:999px; padding:2px 10px; font-size:12px; }
.toggle[aria-pressed="true"] { background:var(--ink); color:var(--panel); border-color:var(--ink); }
.row { display:grid; grid-template-columns:36px 1fr auto; gap:10px; width:100%; text-align:left; border:0; border-bottom:1px solid var(--rule); background:none; padding:10px 4px; }
.row:hover { background:var(--panel); }
.row .rank { font-weight:700; color:var(--muted); }
.row .what { font-family:var(--serif); }
.row .meta, .meta { color:var(--muted); font-size:12px; }
.pill { font-size:11px; font-weight:600; color:var(--t); border:1px solid var(--t); border-radius:999px; padding:0 8px; white-space:nowrap; align-self:start; }
.del { background:color-mix(in srgb, var(--bad) 10%, transparent); text-decoration:line-through; text-decoration-color:var(--bad); }
.ins { background:color-mix(in srgb, var(--ok) 12%, transparent); }
.edit { font-family:var(--serif); white-space:pre-wrap; margin:6px 0; }

/* Inspector */
#inspector h2 { font:500 19px/1.35 var(--serif); margin:6px 0 10px; }
#inspector h3 { font-size:13px; margin:18px 0 6px; color:var(--muted); font-weight:600; }
.track { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; }
.track .stop { border:1px solid var(--rule); border-radius:6px; padding:3px 8px; }
.track .stop.now { border-color:var(--ink); }
.track .stop .chip { margin:0 0 0 4px; }
.cite { display:block; width:100%; text-align:left; background:none; border:0; border-left:2px solid var(--rule); padding:4px 0 4px 10px; margin:6px 0; font-family:var(--serif); color:var(--muted); }
.cite:hover { border-color:var(--ink); color:var(--ink); }
.cite small { display:block; font-family:var(--sans); }
.thread { list-style:none; padding:0; margin:0; counter-reset:step; }
.thread > li { position:relative; padding:0 0 14px 30px; border-left:2px solid var(--rule); margin-left:10px; }
.thread > li:last-child { border-left-color:transparent; }
.thread > li::before { counter-increment:step; content:counter(step); position:absolute; left:-12px; top:0; width:22px; height:22px; border-radius:50%; background:var(--panel); border:2px solid var(--t, var(--rule)); font-size:11px; font-weight:700; display:grid; place-items:center; }
.thread h4 { margin:0 0 4px; font-size:13px; }
.prose { font-family:var(--serif); font-size:15px; }
.link { background:none; border:0; padding:0; color:var(--ink); text-decoration:underline; text-underline-offset:2px; text-align:left; }
.walk { display:flex; gap:8px; margin:8px 0; }
.walk button, dialog button { border:1px solid var(--rule); background:var(--paper); border-radius:6px; padding:3px 10px; font-size:12px; }
.walk button:disabled, dialog button:disabled { opacity:.4; cursor:default; }
.empty { color:var(--muted); margin-top:24px; }
.cq { font-size:13px; margin:3px 0; }

/* Record viewer */
dialog { width:min(820px, 94vw); max-height:86vh; border:1px solid var(--rule); border-radius:8px; background:var(--panel); color:var(--ink); padding:0; }
dialog::backdrop { background:rgb(10 15 20 / .45); }
dialog header { position:sticky; top:0; display:flex; gap:8px; align-items:center; padding:10px 14px; }
dialog pre { margin:0; padding:14px 18px 24px; white-space:pre-wrap; font:14px/1.6 var(--serif); }
mark { background:color-mix(in srgb, var(--warn) 30%, transparent); color:inherit; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<header>
	<div class="bar">
		<h1 id="title">Matter Twin</h1>
		<select id="matter" aria-label="Matter">
			<option value="hartford-v-carson-madrona">Hartford v. Carson Madrona</option>
			<option value="batten-v-kvat">Batten v. K-VA-T Food Stores</option>
			<option value="tr-v-ross">Thomson Reuters v. Ross</option>
		</select>
		<input type="search" id="q" placeholder="Find in the argument" aria-label="Find in the argument">
		<div class="phases" role="radiogroup" aria-label="Phase">
			<button role="radio" data-phase="0">As filed</button>
			<button role="radio" data-phase="1">Under attack</button>
			<button role="radio" data-phase="2">After the exchange</button>
		</div>
	</div>
	<div class="bar"><div class="strip" id="strip"></div><p class="caption" id="caption"></p></div>
</header>
<main>
	<div class="left">
		<nav class="tabs" role="tablist">
			<button role="tab" data-tab="map" aria-selected="true">Argument map</button>
			<button role="tab" data-tab="attacks">Attacks</button>
			<button role="tab" data-tab="redline">Redline</button>
			<button role="tab" data-tab="replay">Replay</button>
		</nav>
		<section id="tab-map"></section>
		<section id="tab-attacks" hidden></section>
		<section id="tab-redline" hidden></section>
		<section id="tab-replay" hidden></section>
	</div>
	<aside id="inspector" aria-live="polite"></aside>
</main>
<dialog id="record"><header><strong id="rec-title"></strong><span style="margin-left:auto"></span><button id="rec-prev">Previous page</button><button id="rec-next">Next page</button><button id="rec-close">Close</button></header><pre id="rec-body"></pre></dialog>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const words = (s) => String(s ?? "").replace(/_/g, " ");
const PHASE_KEY = ["status", "statusUnderAttack", "statusAfter"];
const CAPTION = [
	"The motion as filed. Status comes from the record and the case law alone.",
	"Every verified attack lands at once, before anyone answers.",
	"After the defence, the counter and a ruling on each attack.",
];
const TONE = { secure: "ok", supported: "ok", holds: "ok", closed: "ok", exposed: "warn", weak: "warn", unanchored: "warn", contested: "contest", lost: "bad", undercut: "bad", undermined: "bad", contradicted: "bad", open: "bad", sealed: "info", unchecked: "info" };
const tone = (s) => TONE[s] ?? "info";
const WORST = { open: 3, contested: 2, closed: 1 };

let T = null, R = null, matter = "", phase = 0, sel = null, query = "";
const filt = { lane: new Set(), severity: new Set(), exposure: new Set() };
let P, I, C, A; // id → premise, inference, claim, attack

const status = (kind, id, p = phase) => (T[PHASE_KEY[p]] ?? T.status)[kind]?.[id];
const exposure = (aid, p = phase) => p === 0 ? null : p === 1 ? "open" : (T.exchanges?.find((e) => e.attack === aid)?.ruling.exposure ?? "open");
const attacksOn = (id) => (T.attacks ?? []).filter((a) => a.target === id);
const worst = (as) => as.map((a) => exposure(a.id)).sort((x, y) => WORST[y] - WORST[x])[0];
const nodeText = (kind, id) => kind === "claims" ? C.get(id)?.text : kind === "inferences" ? I.get(id)?.warrant : kind === "premises" ? P.get(id)?.text : A.get(id)?.text;
const kindOf = (id) => C.has(id) ? "claims" : I.has(id) ? "inferences" : P.has(id) ? "premises" : A.has(id) ? "attacks" : null;
const short = (s, n = 140) => (s = String(s ?? "")).length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s;
const stem = (f) => String(f).replace(/^text\//, "").replace(/\.(txt|pdf)$/, "");

/* ---------- loading ---------- */
async function load(m) {
	matter = m; sel = null;
	const [t, r] = await Promise.all([fetch(`/twin/${m}`), fetch(`/replay/${m}`)]);
	R = r.ok ? await r.json() : null;
	if (!t.ok) {
		T = null;
		document.querySelectorAll(".phases button").forEach((b) => (b.disabled = true));
		$("#tab-map").innerHTML = `<p class="empty">No twin for this matter yet. Run <code>npx tsx src/run.ts ${esc(m)}</code> to build it.</p>`;
		["#tab-attacks", "#tab-redline", "#tab-replay", "#inspector", "#strip", "#caption"].forEach((s) => ($(s).innerHTML = ""));
		return;
	}
	T = await t.json();
	P = new Map(T.premises.map((x) => [x.id, x])); I = new Map(T.inferences.map((x) => [x.id, x]));
	C = new Map(T.claims.map((x) => [x.id, x])); A = new Map((T.attacks ?? []).map((x) => [x.id, x]));
	document.querySelectorAll(".phases button").forEach((b) => (b.disabled = !T[PHASE_KEY[b.dataset.phase]]));
	if (!T[PHASE_KEY[phase]]) phase = 0;
	renderMap(); renderAttacks(); renderRedline(); renderReplay();
	setPhase(phase);
	const h = decodeURIComponent(location.hash.slice(1));
	select(kindOf(h) ? h : T.claims.find((c) => !c.parent)?.id, false);
}

/* ---------- argument map ---------- */
const LEVEL = { relief: "Relief sought", element: "Element", sub_issue: "Sub-issue" };
const node = (kind, id, inner) => `<button class="node" data-kind="${kind}" data-id="${esc(id)}"><span class="notch" hidden></span><span class="chip"></span>${inner}</button>`;
function claimHTML(c) {
	const infs = T.inferences.filter((i) => i.to === c.id);
	const kids = T.claims.filter((k) => k.parent === c.id);
	return `<div class="claim lvl-${esc(c.level)}">
		${node("claims", c.id, `<span class="txt">${esc(c.text)}</span>`)}
		${infs.map((i) => {
			const prem = i.from.map((f) => P.get(f)).filter(Boolean);
			return `<div class="beam">${node("inferences", i.id, `<span class="scheme">${esc(words(i.scheme))}</span><span class="txt">${esc(i.warrant)}</span>`)}
				${prem.length ? `<div class="pips">${prem.map((p) => `<button class="pip${p.implicit ? " implicit" : ""}" data-kind="premises" data-id="${esc(p.id)}" title="${esc(p.text)}" aria-label="${p.implicit ? "Implicit premise" : "Premise"}: ${esc(short(p.text, 90))}"></button>`).join("")}</div>` : ""}</div>`;
		}).join("")}
		${kids.length ? `<div class="kids">${kids.map(claimHTML).join("")}</div>` : ""}
	</div>`;
}
function renderMap() {
	$("#tab-map").innerHTML = `<div class="legend">
		<span data-tone="ok"><i></i>holds</span><span data-tone="warn"><i></i>weak or unproven</span><span data-tone="contest"><i></i>contested</span>
		<span data-tone="bad"><i></i>lost or broken</span><span data-tone="info"><i></i>not checkable</span>
		<span>Squares are premises; a hollow square is a premise the brief assumes but never states. A ring marks a live attack.</span></div>
		<div id="map">${T.claims.filter((c) => !c.parent).map(claimHTML).join("")}</div>`;
}
function paint() {
	document.querySelectorAll("#map [data-id]").forEach((el) => {
		const { kind, id } = el.dataset, s = status(kind, id);
		el.dataset.tone = tone(s);
		const as = phase ? attacksOn(id) : [], w = as.length ? worst(as) : "";
		if (el.classList.contains("pip")) { el.dataset.hit = w === "closed" ? "" : w; return; }
		el.querySelector(".chip").textContent = s ?? "";
		const n = el.querySelector(".notch");
		n.hidden = !as.length; n.dataset.tone = tone(w);
		const live = as.filter((a) => exposure(a.id) !== "closed").length;
		n.textContent = !as.length ? "" : phase === 1 ? `${as.length} attack${as.length > 1 ? "s" : ""}` : `${live} of ${as.length} still live`;
	});
	const counts = {};
	$("#strip").innerHTML = T.claims.map((c) => { const s = status("claims", c.id); counts[s] = (counts[s] ?? 0) + 1; return `<button data-tone="${tone(s)}" data-goto="${esc(c.id)}" title="${esc(s)}: ${esc(short(c.text, 80))}" aria-label="${esc(s)}: ${esc(short(c.text, 80))}"></button>`; }).join("")
		+ `<span>${T.claims.length} claims: ${Object.entries(counts).map(([k, v]) => `${v} ${k}`).join(", ")}</span>`;
	applySearch();
}
function applySearch() {
	const q = query.toLowerCase();
	document.querySelectorAll("#map [data-id]").forEach((el) => el.classList.toggle("dim", !!q && !String(nodeText(el.dataset.kind, el.dataset.id)).toLowerCase().includes(q)));
}

/* ---------- phase ---------- */
function setPhase(p) {
	if (!T) return; // no twin for this matter
	phase = p;
	document.querySelectorAll(".phases button").forEach((b) => b.setAttribute("aria-checked", String(+b.dataset.phase === p)));
	$("#caption").textContent = CAPTION[p];
	paint(); renderAttacks(); if (sel) renderInspector();
}

/* ---------- attacks tab ---------- */
const orderedAttacks = () => (T.attacks ?? []).filter((a) =>
	(!filt.lane.size || filt.lane.has(a.lane)) && (!filt.severity.size || filt.severity.has(a.severity)) && (!filt.exposure.size || filt.exposure.has(exposure(a.id, 2)))
).sort((x, y) => x.globalRank - y.globalRank);
function renderAttacks() {
	if (!T) return;
	if (!T.attacks?.length) { $("#tab-attacks").innerHTML = `<p class="empty">No attacks yet. Run the red team for this matter.</p>`; return; }
	const group = (key, vals) => `<b>${key === "exposure" ? "Ruling" : key[0].toUpperCase() + key.slice(1)}</b>` + vals.map((v) => `<button class="toggle" data-f="${key}" data-v="${v}" aria-pressed="${filt[key].has(v)}">${v}</button>`).join("");
	const list = orderedAttacks();
	$("#tab-attacks").innerHTML = `<div class="filters">${group("lane", ["structure", "record", "authority"])}${group("severity", ["critical", "major", "minor"])}${T.exchanges ? group("exposure", ["open", "contested", "closed"]) : ""}</div>
		<p class="meta">${list.length} of ${T.attacks.length} attacks, strongest first. Press j and k to walk through them.</p>
		${list.map((a) => { const e = exposure(a.id); return `<button class="row" data-goto="${esc(a.id)}"><span class="rank">#${a.globalRank}</span>
			<span><span class="what">${esc(short(a.text, 170))}</span><br><span class="meta">${esc(a.lane)}, ${esc(a.type)}, ${esc(a.severity)}${a.beyondBaseline ? ", not in the baseline" : ""}</span></span>
			${e ? `<span class="pill" data-tone="${tone(e)}">${e}</span>` : `<span></span>`}</button>`; }).join("")}`;
}

/* ---------- redline tab ---------- */
function renderRedline() {
	const r = T.redline ?? [];
	if (!r.length) { $("#tab-redline").innerHTML = `<p class="empty">No redline yet. It appears once the defence's edits have been ruled on.</p>`; return; }
	$("#tab-redline").innerHTML = `<p class="meta" style="margin-top:12px">${r.filter((e) => e.applied).length} of ${r.length} edits applied. An edit is kept only when the ruling closed or contested its attack.</p>`
		+ r.map((e) => `<div style="border-bottom:1px solid var(--rule);padding:10px 0"><span class="pill" data-tone="${tone(e.exposure)}">${esc(e.exposure)}</span> <button class="link" data-goto="${esc(e.attack)}">answers attack #${A.get(e.attack)?.globalRank ?? esc(e.attack)}</button>${e.applied ? "" : ' <span class="meta">quote not found in the brief, not applied</span>'}
			<div class="edit"><span class="del">${esc(e.quote)}</span></div><div class="edit"><span class="ins">${esc(e.replacement)}</span></div></div>`).join("");
}

/* ---------- replay tab ---------- */
function renderReplay() {
	if (!R) { $("#tab-replay").innerHTML = `<p class="empty">No replay for this matter. Replay needs an answer key from the real outcome.</p>`; return; }
	const rounds = [["opposition", "The other side's papers"], ["bench", "The bench"], ["ruling", "The ruling"], ...(R.round6 ? [["round6", "Hardened brief, replayed"]] : [])];
	$("#tab-replay").innerHTML = `<p class="meta" style="margin-top:12px">The twin is frozen at the filing date. Reveal what happened next, one round at a time.</p>
		<div class="filters">${rounds.map(([k, l], i) => `<button class="toggle" data-round="${k}" aria-pressed="false">Round ${i + 3}: ${l}</button>`).join("")}</div><div id="reveal"></div>`;
}
function showRound(k) {
	document.querySelectorAll("[data-round]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.round === k)));
	if (k === "round6") {
		$("#reveal").innerHTML = `<p class="meta"><b>Counterfactual.</b> A separate judge agent plays the court's actual decisive reasons against the hardened brief and the same record. Nobody can know how the court would have ruled on the hardened brief.</p>`
			+ R.round6.rulings.map((x) => `<div class="row" style="grid-template-columns:auto 1fr"><span class="pill" data-tone="${tone(x.exposure)}">${esc(x.exposure)}</span><span class="what">${esc(x.reason)}</span></div>`).join("")
			+ (R.round6.bottomLine ? `<p class="prose">${esc(R.round6.bottomLine)}</p>` : "");
		return;
	}
	$("#reveal").innerHTML = R[k].map((m) => `<div class="row" style="grid-template-columns:auto 1fr">
		<span class="pill" data-tone="${m.twin ? "ok" : "bad"}">${m.twin ? "flagged" : "missed"}</span>
		<span><span class="what">${esc(m.item.text)}</span><br><span class="meta">${m.item.decisive ? "Decisive. " : ""}${m.twin ? `Twin: <button class="link" data-goto="${esc(m.twin.attack)}">attack #${m.twin.rank}</button> (${esc(m.twin.lane)}).` : "Twin: not flagged."} Baseline: ${m.baseline ? "flagged" : "not flagged"}.</span></span></div>`).join("")
		+ (k === "ruling" ? `<p class="prose">${esc(R.outcome)}</p><table class="meta">${Object.entries(R.summary).map(([a, v]) => `<tr><td>${esc(a)}</td><td><b>${esc(v)}</b></td></tr>`).join("")}</table><p class="meta">Matching is by the Jev decision model and undercounts some matches; read the rows, not only the totals.</p>` : "");
}

/* ---------- inspector ---------- */
function select(id, push = true) {
	if (!id || !kindOf(id)) return;
	sel = id;
	if (push) history.replaceState(null, "", "#" + encodeURIComponent(id));
	document.querySelectorAll("#map .selected, #map .targeted").forEach((el) => el.classList.remove("selected", "targeted"));
	const target = A.has(id) ? A.get(id).target : id;
	const el = document.querySelector(`#map [data-id="${CSS.escape(target)}"]`);
	if (el) {
		el.classList.add("selected");
		if (A.has(id)) { void el.offsetWidth; el.classList.add("targeted"); }
		if (!$("#tab-map").hidden) el.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
	}
	renderInspector();
}
const track = (kind, id) => `<div class="track">${[0, 1, 2].filter((p) => T[PHASE_KEY[p]]).map((p) => { const s = status(kind, id, p); return `<span class="stop${p === phase ? " now" : ""}">${["As filed", "Under attack", "After"][p]}<span class="chip" data-tone="${tone(s)}">${esc(s)}</span></span>`; }).join("")}</div>`;
const cite = (a) => a.sealed ? `<p class="meta">Sealed or not public.</p>` : `<button class="cite" data-file="${esc(stem(a.file))}" data-page="${a.page}" data-quote="${esc(a.quote)}">“${esc(short(a.quote, 220))}”<small>${esc(stem(a.file))}, page ${a.page}${a.support ? `, ${esc(words(a.support))}` : ""}</small></button>`;
const attackList = (id) => { const as = attacksOn(id); return as.length ? `<h3>Attacks on this (${as.length})</h3>` + as.sort((x, y) => x.globalRank - y.globalRank).map((a) => { const e = exposure(a.id); return `<button class="row" data-goto="${esc(a.id)}" style="grid-template-columns:36px 1fr auto"><span class="rank">#${a.globalRank}</span><span class="what">${esc(short(a.text, 130))}</span>${e ? `<span class="pill" data-tone="${tone(e)}">${e}</span>` : "<span></span>"}</button>`; }).join("") : ""; };
const goto = (id) => `<button class="link" data-goto="${esc(id)}">${esc(short(nodeText(kindOf(id), id), 110))}</button>`;

function renderInspector() {
	const box = $("#inspector"), k = kindOf(sel);
	if (k === "claims") {
		const c = C.get(sel), infs = T.inferences.filter((i) => i.to === c.id), kids = T.claims.filter((x) => x.parent === c.id);
		box.innerHTML = `<p class="meta">${LEVEL[c.level] ?? esc(c.level)}${c.parent ? ` under ${goto(c.parent)}` : ""}</p><h2>${esc(c.text)}</h2>${track("claims", c.id)}
			<p class="meta">Burden: ${c.burden === "us" ? "on the movant" : "on the other side"}. Standard: ${esc(words(c.standard))}.</p>
			${infs.length ? `<h3>Reasoning into this claim</h3>${infs.map((i) => `<p>${goto(i.id)} <span class="chip" data-tone="${tone(status("inferences", i.id))}">${esc(status("inferences", i.id))}</span></p>`).join("")}` : ""}
			${kids.length ? `<h3>Sub-claims</h3>${kids.map((x) => `<p>${goto(x.id)} <span class="chip" data-tone="${tone(status("claims", x.id))}">${esc(status("claims", x.id))}</span></p>`).join("")}` : ""}
			${attackList(c.id)}`;
	} else if (k === "inferences") {
		const i = I.get(sel);
		box.innerHTML = `<p class="meta">Inference, ${esc(words(i.scheme))}, into ${goto(i.to)}</p><h2>${esc(i.warrant)}</h2>${track("inferences", i.id)}
			<h3>Built on</h3>${i.from.map((f) => `<p>${goto(f)}${P.has(f) ? ` <span class="chip" data-tone="${tone(status("premises", f))}">${esc(status("premises", f))}</span>` : ""}</p>`).join("")}
			<h3>Critical questions</h3>${i.criticalQuestions.map((q) => `<p class="cq">${q.status === "open" ? "Open" : "Answered"}: ${esc(q.q)}</p>`).join("")}
			${attackList(i.id)}`;
	} else if (k === "premises") {
		const p = P.get(sel), into = T.inferences.filter((i) => i.from.includes(p.id));
		box.innerHTML = `<p class="meta">${p.implicit ? "Implicit premise: the brief relies on this but never states it" : `Premise, ${esc(p.kind)}`}</p><h2>${esc(p.text)}</h2>${track("premises", p.id)}
			${p.citation ? `<p class="meta">Cites ${esc(p.citation.text)}. ${p.citation.verified ? "Found on CourtListener." : p.citation.statute ? "A statute, not checked." : esc(p.citation.note ?? "Not found on CourtListener.")}</p>` : ""}
			<h3>In the record</h3>${p.anchors.length ? p.anchors.map(cite).join("") : `<p class="meta">No record support found.</p>`}
			<h3>Supports</h3>${into.map((i) => `<p>${goto(i.id)}</p>`).join("")}
			${attackList(p.id)}`;
	} else if (k === "attacks") {
		const a = A.get(sel), r = T.responses?.find((x) => x.answers === a.id), e = T.exchanges?.find((x) => x.attack === a.id);
		const list = orderedAttacks(), at = list.findIndex((x) => x.id === a.id);
		box.innerHTML = `<div class="walk"><button data-walk="-1" ${at <= 0 ? "disabled" : ""}>Previous attack</button><button data-walk="1" ${at < 0 || at >= list.length - 1 ? "disabled" : ""}>Next attack</button></div>
			<p class="meta">Attack #${a.globalRank}: ${esc(a.lane)}, ${esc(a.type)}, ${esc(a.severity)}${a.beyondBaseline ? ", not in the baseline" : ""}</p>
			<p class="meta">Targets ${goto(a.target)}</p>
			<ol class="thread">
				<li data-tone="bad"><h4>Attack</h4><div class="prose">${esc(a.text)}</div>${a.question ? `<p class="meta">Raises the critical question: ${esc(a.question)}</p>` : ""}
					${a.anchors.map(cite).join("")}
					${a.authority.map((c) => `<p class="meta"><a href="${esc(c.courtListenerUrl)}" target="_blank" rel="noopener">${esc(c.caseName)}</a>, ${esc(c.citation)}, ${esc(c.dateFiled)}. ${esc(c.proposition)}${c.quote ? `<br><span class="prose">“${esc(c.quote)}”</span>` : ""}</p>`).join("")}</li>
				${r ? `<li data-tone="ok"><h4>Defence: ${esc(r.move)}</h4><div class="prose">${esc(r.text)}</div>${r.anchors.map(cite).join("")}
					${r.edit ? `<p class="meta">Proposed edit to the brief</p><div class="edit"><span class="del">${esc(r.edit.quote)}</span></div><div class="edit"><span class="ins">${esc(r.edit.replacement)}</span></div>` : ""}
					${r.task ? `<p class="meta">Still to do (${esc(words(r.task.kind))}): ${esc(r.task.text)}</p>` : ""}</li>` : ""}
				${e?.counter ? `<li data-tone="bad"><h4>Counter</h4><div class="prose">${esc(e.counter)}</div></li>` : ""}
				${e ? `<li data-tone="${tone(e.ruling.exposure)}"><h4>Ruling: ${esc(e.ruling.exposure)}</h4><div class="prose">${esc(e.ruling.reason)}</div></li>` : ""}
			</ol>${!r && !e ? `<p class="meta">No defence or ruling yet.</p>` : ""}`;
	}
}

/* ---------- record viewer ---------- */
const rec = { doc: null, page: 1, quote: "" };
const cache = {};
async function openRecord(file, page, quote) {
	const key = `${matter}/${file}`;
	if (!cache[key]) { const r = await fetch(`/record/${matter}/${encodeURIComponent(file)}`); cache[key] = r.ok ? await r.json() : null; }
	if (!cache[key]) { alertText(`This document is not in the record as known at filing: ${file}`); return; }
	Object.assign(rec, { doc: cache[key], page: +page || 1, quote });
	drawRecord(); $("#record").showModal();
}
function alertText(t) { $("#rec-title").textContent = t; $("#rec-body").textContent = ""; $("#rec-prev").disabled = $("#rec-next").disabled = true; $("#record").showModal(); }
function drawRecord() {
	const n = rec.doc.pages.length, text = rec.doc.pages[rec.page - 1] ?? "";
	$("#rec-title").textContent = `${rec.doc.file}, page ${rec.page} of ${n}`;
	$("#rec-prev").disabled = rec.page <= 1; $("#rec-next").disabled = rec.page >= n;
	const toks = rec.quote.split(/\s+/).filter(Boolean).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
	const m = toks.length ? new RegExp(toks.join("\\s+")).exec(text) : null;
	$("#rec-body").innerHTML = m ? esc(text.slice(0, m.index)) + `<mark>${esc(m[0])}</mark>` + esc(text.slice(m.index + m[0].length)) : esc(text);
	$("#rec-body mark")?.scrollIntoView({ block: "center" });
}

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
	const t = ev.target.closest("button, a"); if (!t) return;
	if (t.dataset.phase) return setPhase(+t.dataset.phase);
	if (t.dataset.tab) {
		document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b === t)));
		document.querySelectorAll(".left > section").forEach((s) => (s.hidden = s.id !== `tab-${t.dataset.tab}`));
		return;
	}
	if (t.dataset.f) { const s = filt[t.dataset.f]; s.has(t.dataset.v) ? s.delete(t.dataset.v) : s.add(t.dataset.v); return renderAttacks(); }
	if (t.dataset.round) return showRound(t.dataset.round);
	if (t.dataset.walk) return walk(+t.dataset.walk);
	if (t.classList.contains("cite")) return openRecord(t.dataset.file, t.dataset.page, t.dataset.quote);
	const id = t.dataset.goto ?? (t.closest("#map") ? t.dataset.id : null);
	if (id) select(id);
});
function walk(d) {
	const list = orderedAttacks(); if (!list.length) return;
	const at = list.findIndex((x) => x.id === sel);
	const next = list[at < 0 ? 0 : Math.min(list.length - 1, Math.max(0, at + d))];
	if (phase === 0 && T.statusUnderAttack) setPhase(T.statusAfter ? 2 : 1);
	select(next.id);
}
document.addEventListener("keydown", (ev) => {
	if (ev.target.matches?.("input, select, textarea") || ev.metaKey || ev.ctrlKey || ev.altKey || $("#record").open || !T) return;
	if (["1", "2", "3"].includes(ev.key) && T[PHASE_KEY[+ev.key - 1]]) setPhase(+ev.key - 1);
	if (ev.key === "j") walk(1);
	if (ev.key === "k") walk(-1);
});
$("#q").addEventListener("input", (e) => { query = e.target.value.trim(); if (T) applySearch(); });
$("#matter").addEventListener("change", (e) => load(e.target.value));
$("#rec-prev").onclick = () => { rec.page--; drawRecord(); };
$("#rec-next").onclick = () => { rec.page++; drawRecord(); };
$("#rec-close").onclick = () => $("#record").close();
load($("#matter").value);
</script>
</body>
